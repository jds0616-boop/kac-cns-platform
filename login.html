<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - KAC CNS Training Platform</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  * { box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
  body { 
    background: #0f172a; height: 100vh; display: flex; flex-direction: column; 
    align-items: center; justify-content: center; margin: 0; color: #fff;
  }
  .login-card {
    background: #1e293b; padding: 40px; border-radius: 20px; width: 400px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5); text-align: center;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .logo { font-size: 24px; font-weight: 800; margin-bottom: 30px; display: block; }
  .logo span { color: #3b82f6; }
  
  .info-text { font-size: 13px; color: #94a3b8; margin-bottom: 20px; word-break: keep-all; }
  
  input {
    width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #334155;
    background: #0f172a; color: #fff; margin-bottom: 15px; font-size: 16px; outline: none;
    transition: 0.3s;
  }
  input:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
  
  button {
    width: 100%; padding: 15px; border-radius: 10px; border: none;
    background: #3b82f6; color: #fff; font-size: 16px; font-weight: 700;
    cursor: pointer; transition: 0.3s;
  }
  button:hover { background: #2563eb; transform: translateY(-2px); }
  button:active { transform: translateY(0); }
  
  .message {
    margin-top: 15px; font-size: 14px; min-height: 20px; color: #ef4444; font-weight: 500;
  }
</style>
</head>
<body>
  <div class="login-card">
    <div class="logo">KAC <span>CNS</span> Platform</div>
    
    <!-- 안내 메시지 -->
    <p id="statusText" class="info-text">시스템 접속을 위해 인증이 필요합니다.</p>
    
    <input type="password" id="pwInput" placeholder="비밀번호 입력" onkeyup="if(window.event.keyCode==13){handleAuth()}">
    <button id="btnAction" onclick="handleAuth()">접속하기</button>
    <div id="msg" class="message"></div>
  </div>

  <script>
    // SHA-256 암호화 함수
    async function sha256(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // 초기 상태 확인 (저장된 비밀번호가 있는지 체크)
    const storedHash = localStorage.getItem('kac_access_pw_hash');
    const statusText = document.getElementById('statusText');
    const btnAction = document.getElementById('btnAction');
    const pwInput = document.getElementById('pwInput');

    // 비밀번호가 없으면 초기 설정 모드로 전환
    if (!storedHash) {
        statusText.textContent = "⚠️ 초기 설정: 사용할 접속 비밀번호를 등록해주세요.";
        statusText.style.color = "#fbbf24"; 
        pwInput.placeholder = "암호를 입력해주세요";
        btnAction.textContent = "비밀번호 등록 및 접속";
    }

    async function handleAuth() {
        const input = pwInput.value.trim().toUpperCase();
        const msgBox = document.getElementById('msg');
        
        if(!input) {
            msgBox.textContent = "비밀번호를 입력해주세요.";
            return;
        }

        const inputHash = await sha256(input);

        if (!storedHash) {
            // [1] 등록 모드: 입력한 비밀번호를 암호화하여 저장
            localStorage.setItem('kac_access_pw_hash', inputHash);
            
            msgBox.style.color = "#4ade80";
            msgBox.textContent = "비밀번호 설정 완료! 접속 중...";
            completeLogin();
        } else {
            // [2] 로그인 모드: 저장된 암호와 비교
            if(inputHash === storedHash) {
                msgBox.style.color = "#4ade80";
                msgBox.textContent = "인증 성공! 이동합니다...";
                completeLogin();
            } else {
                msgBox.style.color = "#ef4444";
                msgBox.textContent = "비밀번호가 올바르지 않습니다.";
                pwInput.value = '';
                pwInput.focus();
            }
        }
    }

    function completeLogin() {
        localStorage.setItem('kac_login_time', new Date().getTime());
        sessionStorage.setItem('kac_access_token', 'granted');
        setTimeout(() => location.replace('index.html'), 500);
    }
    
    // 자동 로그인 체크
    window.onload = function() {
        const loginTime = localStorage.getItem('kac_login_time');
        const now = new Date().getTime();
        const expiry = 5 * 60 * 60 * 1000; // 5시간

        // 비밀번호가 설정되어 있고 + 로그인 시간이 유효하면 자동 접속
        if(localStorage.getItem('kac_access_pw_hash') && loginTime && (now - loginTime < expiry)) {
            sessionStorage.setItem('kac_access_token', 'granted');
            location.replace('index.html');
        }
    }
  </script>
</body>
</html>
