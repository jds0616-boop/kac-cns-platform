<script>
  // 2. Firebase 설정 (사용자 정보 반영)
  const firebaseConfig = {
    apiKey: "AIzaSyAUt6WqxWjRoB9xgAWXq2YhVMQutaOZCBc",
    authDomain: "catc-dfb9a.firebaseapp.com",
    databaseURL: "https://catc-dfb9a-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "catc-dfb9a",
    storageBucket: "catc-dfb9a.firebasestorage.app",
    messagingSenderId: "669905270724",
    appId: "1:669905270724:web:c89fcc1d9c8f81b3071691",
    measurementId: "G-H1ME51B4MZ"
  };

  // Firebase 초기화
  if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.database();

  // [보안] 로그인 세션 체크
  if(sessionStorage.getItem('kac_access_token') !== 'granted') {
    location.replace('login.html');
  }

  // [도구] 한글 입력 변환 함수
  function korToEng(str) {
      const kor = "ㅂㅈㄷㄱㅅㅛㅕㅑㅐㅔㅁㄴㅇㄹㅎㅗㅓㅏㅣㅋㅌㅊㅍㅠㅜㅡ";
      const eng = "qwertyuiopasdfghjklzxcvbnm";
      let result = "";
      for (let i = 0; i < str.length; i++) {
          const char = str[i];
          const index = kor.indexOf(char);
          if (index !== -1) result += eng[index];
          else result += char;
      }
      return result;
  }

  // [보안] 1시간 활동 감지 로그아웃
  let inactivityTimer;
  function resetInactivityTimer() {
      clearTimeout(inactivityTimer);
      inactivityTimer = setTimeout(forceLogout, 3600000); 
  }
  function forceLogout() {
      alert("1시간 동안 활동이 없어 보안을 위해 로그아웃됩니다.");
      sessionStorage.clear();
      localStorage.removeItem('kac_login_time');
      location.replace('login.html');
  }

  window.onload = resetInactivityTimer;
  window.onmousemove = resetInactivityTimer;
  window.onmousedown = resetInactivityTimer;
  window.ontouchstart = resetInactivityTimer;
  window.onclick = resetInactivityTimer;
  window.onkeypress = resetInactivityTimer;
  window.onscroll = resetInactivityTimer;
</script>

<style>

<body>

<header>
  <div class="header-left">
    <div class="logo-text" onclick="location.href='index.html'">KAC CNS Training Platform</div>
  </div>
  <div class="header-right">
    <div class="settings-btn" onclick="openSettings()" style="cursor:pointer; font-size:20px;">⚙️</div>
    <img src="logo.png" style="height:30px; margin-left:15px;">
  </div>
</header>

<div class="mindmap-container">
  <div class="root-section">
    <div class="root-card-integrated" onclick="location.href='index.html'">
      <div id="rootIcon" class="root-icon">?</div>
      <div id="rootTitle" class="root-title">Loading...</div>
      <div style="background:var(--theme-color); color:white; text-align:center; padding:10px; font-size:12px; font-weight:800;">홈으로 이동</div>
    </div>
  </div>
  <div id="menuListSection" class="list-section">
    <div id="menuListContainer" style="display:flex; flex-direction:column; gap:20px;"></div>
  </div>
</div>

<!-- 설정 모달 -->
<div id="settingsModal" class="modal-overlay">
  <div class="modal-card">
    <h3>⚙️ 시스템 설정</h3>
    <div id="adminSettings" style="display:none; margin-top:20px;">
      <button class="btn-modal btn-success" onclick="saveAllToFirebase()">☁️ 서버에 최종 저장 (Firebase)</button>
      <button class="btn-modal btn-danger" style="margin-top:10px;" onclick="logoutAdmin()">관리자 로그아웃</button>
    </div>
    <div id="guestSettings">
      <button class="btn-modal btn-primary" onclick="toggleAdmin()">관리자 로그인</button>
    </div>
    <button class="btn-modal" style="margin-top:20px; background:#eee;" onclick="closeModal('settingsModal')">닫기</button>
  </div>
</div>

<!-- 수정 모달 -->
<div id="itemEditModal" class="modal-overlay">
  <div class="modal-card">
    <h3>📦 메뉴 수정</h3>
    <input type="text" id="editItemLabel" class="setting-input" placeholder="시설 명칭">
    <input type="text" id="editItemLine1" class="setting-input" placeholder="아이콘 텍스트">
    <input type="text" id="editItemLink" class="setting-input" placeholder="외부 링크 (선택)">
    <button class="btn-modal btn-primary" onclick="applyEdit()">임시 적용</button>
    <button class="btn-modal" style="background:#eee;" onclick="closeModal('itemEditModal')">취소</button>
  </div>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const type = params.get('type'); // CAT_... ID값
  
  let globalData = { categories: [] };
  let isAdmin = localStorage.getItem('kac_admin_mode') === '1';
  let currentCategory = null;
  let currentEditIdx = -1;

  async function init() {
    if(isAdmin) document.body.classList.add('admin-mode');

    // 1. Firebase에서 데이터 로드
    try {
        const snapshot = await db.ref('/').once('value');
        if(snapshot.exists()) {
            globalData = snapshot.val();
            currentCategory = globalData.categories.find(c => c && c.id === type);
            if(currentCategory) {
                render();
                updateStyles();
            } else {
                alert("잘못된 접근입니다.");
                location.href = 'index.html';
            }
        }
    } catch(e) { console.error("Firebase 로드 실패", e); }
  }

  function updateStyles() {
    document.documentElement.style.setProperty('--theme-color', currentCategory.color);
    document.getElementById('rootIcon').textContent = currentCategory.code;
    document.getElementById('rootTitle').textContent = currentCategory.name;
  }

  function render() {
    const container = document.getElementById('menuListContainer');
    container.innerHTML = '';
    
    // 비공개 항목 필터링 (관리자 아닐 때)
    const menus = isAdmin ? currentCategory.menus : currentCategory.menus.filter(m => m.visible !== false);

    menus.forEach((menu, idx) => {
        const bar = document.createElement('div');
        bar.className = 'menu-bar';
        bar.onclick = () => {
            if(menu.link) window.open(menu.link, '_blank');
            else location.href = `viewer_list.html?type=${type}&menu=${encodeURIComponent(menu.label)}&id=${menu.id}`;
        };

        let adminHtml = isAdmin ? `
            <div class="admin-btns" onclick="event.stopPropagation()">
                <button class="btn-xs" onclick="openEdit(${idx})">수정</button>
                <button class="btn-xs" style="color:red" onclick="deleteMenu(${idx})">삭제</button>
            </div>
        ` : '';

        bar.innerHTML = `
            <div class="menu-pill-icon">${menu.line1 || '?'}</div>
            <div class="menu-title">${menu.label}</div>
            ${adminHtml}
        `;
        container.appendChild(bar);
    });

    if(isAdmin) {
        const addBtn = document.createElement('div');
        addBtn.className = 'menu-bar';
        addBtn.style.borderStyle = 'dashed';
        addBtn.style.justifyContent = 'center';
        addBtn.innerHTML = '+ 새 메뉴 추가';
        addBtn.onclick = () => addNewMenu();
        container.appendChild(addBtn);
    }
  }

  function openEdit(idx) {
    currentEditIdx = idx;
    const m = currentCategory.menus[idx];
    document.getElementById('editItemLabel').value = m.label;
    document.getElementById('editItemLine1').value = m.line1;
    document.getElementById('editItemLink').value = m.link || '';
    document.getElementById('itemEditModal').style.display = 'flex';
  }

  function applyEdit() {
    const m = currentCategory.menus[currentEditIdx];
    m.label = document.getElementById('editItemLabel').value;
    m.line1 = document.getElementById('editItemLine1').value;
    m.link = document.getElementById('editItemLink').value;
    render();
    closeModal('itemEditModal');
    alert("임시 적용되었습니다. 최종 저장을 위해 설정 메뉴에서 [서버에 최종 저장]을 눌러주세요.");
  }

  function addNewMenu() {
    const name = prompt("새 메뉴 명칭을 입력하세요.");
    if(name) {
        currentCategory.menus.push({ id: 'id_'+Date.now(), label: name, line1: 'NEW', subjects: [] });
        render();
    }
  }

  function deleteMenu(idx) {
    if(confirm("정말 삭제하시겠습니까?")) {
        currentCategory.menus.splice(idx, 1);
        render();
    }
  }

  async function saveAllToFirebase() {
    if(!confirm("수정된 내용을 서버에 저장하시겠습니까?")) return;
    try {
        await db.ref('/').set(globalData);
        alert("✅ 서버에 실시간 저장되었습니다!");
    } catch(e) { alert("저장 실패: " + e.message); }
  }

  function openSettings() {
    document.getElementById('adminSettings').style.display = isAdmin ? 'block' : 'none';
    document.getElementById('guestSettings').style.display = isAdmin ? 'none' : 'block';
    document.getElementById('settingsModal').style.display = 'flex';
  }

  async function toggleAdmin() {
    const pw = prompt("관리자 비밀번호");
    if(!pw) return;
    const hash = await sha256(korToEng(pw).toUpperCase());
    if(hash === globalData.security.admin_pw) {
        localStorage.setItem('kac_admin_mode', '1');
        location.reload();
    } else { alert("비밀번호 불일치"); }
  }

  function logoutAdmin() {
    localStorage.removeItem('kac_admin_mode');
    location.reload();
  }

  async function sha256(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function closeModal(id) { document.getElementById(id).style.display = 'none'; }
  function hexToRgb(hex) { /* 생략(CSS 변수용) */ }

  init();
</script>
</body>
