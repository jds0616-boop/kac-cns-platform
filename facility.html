<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>과목 리스트 - KAC CNS Training Platform</title>
<!-- 로그인 체크 -->
<script>
  if(sessionStorage.getItem('kac_access_token') !== 'granted') {
    alert("로그인이 필요합니다.");
    location.replace('login.html');
  }
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  :root { 
    --theme-color: #2563eb; 
    --theme-rgb: 37, 99, 235;
    --navy: #0f172a; --bg-main: #f0f4f8; --bg-card: #ffffff; 
    --text-main: #000000; --text-sub: #334155; 
    --border-card: 2px solid transparent; 
    --shadow: 0 5px 15px rgba(0,0,0,0.05);
    --btn-bg: #f8fafc; --btn-border: #e2e8f0; --btn-text: #64748b;
    --header-h: 75px;
  }
  body.dark-mode {
    --navy: #020617; --bg-main: #0f172a; --bg-card: #1e293b; 
    --text-main: #f1f5f9; --text-sub: #cbd5e1; 
    --border-card: 2px solid rgba(255,255,255,0.1); 
    --shadow: 0 5px 20px rgba(0,0,0,0.5);
    --btn-bg: rgba(255,255,255,0.05); --btn-border: rgba(255,255,255,0.2); --btn-text: #e2e8f0;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
  
  html, body { width: 100%; height: 100%; overflow: hidden; }

  body { background: var(--bg-main); display: flex; flex-direction: column; color: var(--text-main); transition: 0.3s; }

  /* 관리자 전용 */
  body:not(.admin-mode) .admin-only { display: none !important; }

  /* 헤더 스타일 (고정) */
  header { 
    height: var(--header-h); background: var(--navy); 
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
    z-index: 1000; flex-shrink: 0; position: fixed; top: 0; left: 0; width: 100%;
  }
  
  .header-left { display: flex; align-items: center; gap: 15px; }
  .logo-text { font-size: 20px; font-weight: 800; cursor: pointer; white-space: nowrap; }
  .header-right { display: flex; align-items: center; gap: 15px; }

  /* 마인드맵 컨테이너 */
  .mindmap-container {
      display: flex;
      width: 100%; height: 100%;
      padding-top: var(--header-h); /* 헤더 공간 */
      position: relative;
      overflow: hidden;
  }

  /* [좌측] 루트 노드 (고정) */
  .root-section {
      width: 350px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: flex-end;
      padding-right: 40px; position: relative;
      z-index: 10;
  }
  .root-card {
      background: var(--bg-card);
      border: 3px solid var(--theme-color);
      border-radius: 20px;
      padding: 30px;
      width: 260px;
      box-shadow: var(--shadow);
      text-align: center;
      position: relative;
      z-index: 2;
  }
  .root-icon {
      font-size: 40px; font-weight: 900; color: var(--theme-color);
      margin-bottom: 10px; display: block;
  }
  .root-title {
      font-size: 22px; font-weight: 800; word-break: keep-all; line-height: 1.3;
  }

  /* 연결선 (Curved Line) */
  .connector-line {
      position: absolute; right: 0; top: 50%;
      width: 40px; height: 4px; background: var(--theme-color);
      border-radius: 4px;
      z-index: 1;
  }
  /* 중앙 세로선 (버스) */
  .branch-bus {
      position: absolute; left: 350px; top: 0; bottom: 0;
      width: 4px; background: rgba(var(--theme-rgb), 0.2);
      z-index: 1;
  }

  /* [우측] 리스트 섹션 (스크롤) */
  .list-section {
      flex: 1;
      overflow-y: auto;
      padding: 40px 40px 100px 40px; /* 하단 여백 충분히 */
      display: flex; flex-direction: column; gap: 20px;
      position: relative;
      scrollbar-width: none;
  }
  .list-section::-webkit-scrollbar { display: none; }

  /* [수정] 과목 카드 디자인 (Single Line) */
  .subject-card {
      background: var(--bg-card);
      border-radius: 18px;
      padding: 20px 25px;
      box-shadow: var(--shadow);
      display: flex; align-items: center; gap: 20px;
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid var(--border-card);
      cursor: pointer;
  }
  .subject-card:hover {
      transform: translateX(5px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
      border-color: var(--theme-color);
  }
  /* 연결점 */
  .subject-card::before {
      content: ''; position: absolute; left: -44px; top: 50%;
      width: 44px; height: 2px; background: rgba(var(--theme-rgb), 0.3);
  }
  .subject-card::after {
      content: ''; position: absolute; left: -48px; top: 50%; transform: translateY(-50%);
      width: 10px; height: 10px; border-radius: 50%; background: var(--theme-color);
  }

  /* [수정] 아이콘 박스 (Auto Width) */
  .subj-icon-box {
      background: rgba(var(--theme-rgb), 0.1);
      color: var(--theme-color);
      border: 1px solid rgba(var(--theme-rgb), 0.2);
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 14px; font-weight: 800;
      white-space: nowrap;
      min-width: 60px; text-align: center;
  }

  .subj-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .subj-title { font-size: 18px; font-weight: 700; color: var(--text-main); }
  .subj-meta { font-size: 12px; color: var(--text-sub); display: flex; gap: 8px; opacity: 0.8; }
  
  /* 상태 뱃지 */
  .badge { padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; }
  .badge.pdf { background: #dcfce7; color: #166534; }
  .badge.link { background: #dbeafe; color: #1e40af; }

  /* 관리자 버튼 */
  .admin-btns { display: flex; gap: 5px; }
  .btn-xs { padding: 4px 8px; font-size: 11px; border-radius: 6px; border: 1px solid #e2e8f0; background: #fff; cursor: pointer; color: #64748b; }
  .btn-xs:hover { background: #f1f5f9; color: #0f172a; }

  /* 추가 버튼 */
  .add-subject-card {
      border: 2px dashed #cbd5e1; background: transparent;
      justify-content: center; color: #94a3b8; font-weight: 700;
      padding: 15px; box-shadow: none;
  }
  .add-subject-card:hover { border-color: var(--theme-color); color: var(--theme-color); background: rgba(var(--theme-rgb), 0.05); }
  .add-subject-card::before, .add-subject-card::after { display: none; } /* 연결선 없음 */

  /* 모바일 대응 */
  @media (max-width: 768px) {
      .mindmap-container { flex-direction: column; overflow-y: auto; }
      
      /* 상단 루트 카드 */
      .root-section { 
          width: 100%; height: auto; padding: 20px; 
          justify-content: center; position: sticky; top: 0; 
          background: var(--bg-main); z-index: 20; 
          border-bottom: 1px solid rgba(0,0,0,0.05);
      }
      .root-card { 
          width: 100%; padding: 15px; display: flex; align-items: center; gap: 15px; text-align: left; 
          flex-direction: row; /* 가로 배치 */
      }
      .root-icon { margin-bottom: 0; font-size: 24px; width: 40px; }
      .root-title { font-size: 16px; }
      .connector-line { display: none; } /* 가로선 숨김 */

      /* 리스트 섹션 */
      .list-section { 
          padding: 20px; overflow: visible; 
          border-left: 2px solid rgba(var(--theme-rgb), 0.2);
          margin-left: 30px; margin-right: 10px;
          gap: 15px;
      }
      .branch-bus { display: none; } /* PC용 버스선 숨김 */

      /* 카드 스타일 */
      .subject-card { padding: 15px; gap: 12px; }
      .subject-card::before { left: -22px; width: 22px; } /* 연결선 길이 조정 */
      .subject-card::after { left: -25px; } /* 점 위치 조정 */
      
      .subj-icon-box { font-size: 12px; padding: 6px 10px; min-width: auto; }
      .subj-title { font-size: 15px; }
      
      .admin-btns { flex-direction: column; gap: 2px; }
  }

  /* PDF 뷰어 오버레이 */
  #pdfOverlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: none; }
  .close-v { position: absolute; top: 20px; right: 20px; color: #fff; font-size: 30px; cursor: pointer; z-index: 10001; }
  #viewerBody { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; overflow: auto; }
  canvas { max-width: 100%; height: auto; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
  
  /* 모달 공통 */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 11000; display: none; align-items: center; justify-content: center; }
  .modal-card { background: var(--bg-card); padding: 30px; border-radius: 20px; width: 400px; }
  .setting-input { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #e2e8f0; }
  .btn-modal { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; margin-top: 5px; }
  .btn-primary { background: #0f172a; color: #fff; }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo-text" onclick="location.href='index.html'">KAC CNS Training Platform</div>
  </div>
  <div class="header-right">
    <div class="settings-btn" onclick="location.href='index.html'">🏠</div>
  </div>
</header>

<div class="mindmap-container">
  
  <!-- [좌측] 루트 노드 (고정) -->
  <div class="root-section">
    <div class="root-card">
      <div id="rootIcon" class="root-icon">?</div>
      <div id="rootTitle" class="root-title">Loading...</div>
    </div>
    <div class="connector-line"></div>
  </div>

  <!-- [중앙] 연결 버스 라인 -->
  <div class="branch-bus"></div>

  <!-- [우측] 과목 리스트 (스크롤) -->
  <div id="subjectList" class="list-section">
    <!-- JS로 카드 생성됨 -->
  </div>

</div>

<!-- PDF 뷰어 -->
<div id="pdfOverlay">
  <div class="close-v" onclick="closeViewer()">✕</div>
  <div id="viewerBody"></div>
</div>

<!-- 수정/추가 모달 -->
<div id="editModal" class="modal-overlay">
  <div class="modal-card">
    <h3>📝 과목 수정/추가</h3>
    <input type="text" id="editName" class="setting-input" placeholder="과목명">
    <input type="text" id="editPdf" class="setting-input" placeholder="PDF 파일명 (예: CH1)">
    <input type="text" id="editLink" class="setting-input" placeholder="외부 링크 URL">
    <button class="btn-modal btn-primary" onclick="saveSubject()">저장</button>
    <button class="btn-modal" style="background:#e2e8f0" onclick="document.getElementById('editModal').style.display='none'">취소</button>
  </div>
</div>

<script>
  // 초기 설정
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js";
  
  const params = new URLSearchParams(location.search);
  const type = params.get('type'); // Category ID (ex: COMM)
  const menuLabel = params.get('menu'); // Menu Name (ex: 전파이론)
  const menuId = params.get('id'); // Menu ID
  
  let isAdmin = localStorage.getItem('kac_admin_mode') === '1';
  let subjects = [];
  let currentEditIdx = -1;

  async function init() {
      // 테마 설정
      const theme = localStorage.getItem('kac_theme') || 'light';
      document.body.classList.toggle('dark-mode', theme === 'dark');

      if(isAdmin) document.body.classList.add('admin-mode');

      // 스타일 및 데이터 로드
      loadStyleData();
      loadSubjects();
      render();
  }

  function loadStyleData() {
      // 인덱스에서 설정한 카테고리 스타일(색상 등) 가져오기
      const sData = localStorage.getItem(`kac_style_${type}`);
      const style = sData ? JSON.parse(sData) : { name: type, color: '#2563eb' };
      
      document.documentElement.style.setProperty('--theme-color', style.color || '#2563eb');
      
      // 루트 카드 정보 설정
      // 아이콘(코드) 찾기: 메뉴 데이터에서 line1 찾기
      const menuDataStr = localStorage.getItem(`kac_menu_${type}`);
      let iconCode = style.code || type.charAt(0);
      if(menuDataStr) {
          const menus = JSON.parse(menuDataStr);
          const currentMenu = menus.find(m => m.dataId === menuId);
          if(currentMenu && currentMenu.line1) iconCode = currentMenu.line1;
      }

      document.getElementById('rootIcon').textContent = iconCode;
      document.getElementById('rootTitle').textContent = menuLabel || "상세 목록";
  }

  function loadSubjects() {
      // 로컬스토리지에서 과목 데이터 불러오기
      const key = `kac_subs_${type}_${menuId}`;
      const data = localStorage.getItem(key);
      subjects = data ? JSON.parse(data) : [];
  }

  function render() {
      const list = document.getElementById('subjectList');
      list.innerHTML = '';

      if(subjects.length === 0 && !isAdmin) {
          list.innerHTML = `<div style="text-align:center; color:#94a3b8; padding:50px;">등록된 과정이 없습니다.</div>`;
          return;
      }

      subjects.forEach((sub, idx) => {
          if(!sub.active && !isAdmin) return; // 비활성은 관리자만

          const card = document.createElement('div');
          card.className = 'subject-card';
          card.onclick = () => openContent(sub);

          // 뱃지 처리
          let badges = '';
          if(sub.pdfName) badges += `<span class="badge pdf">PDF</span>`;
          if(sub.link) badges += `<span class="badge link">Link</span>`;

          // 아이콘 박스 텍스트 (PDF명이나 링크가 없으면 기본값)
          let iconText = "DOC";
          if(sub.pdfName) iconText = "PDF";
          if(sub.link) iconText = "WEB";

          // 관리자 버튼
          let adminHtml = '';
          if(isAdmin) {
              adminHtml = `
                <div class="admin-btns admin-only" onclick="event.stopPropagation()">
                   <button class="btn-xs" onclick="editSubject(${idx})">수정</button>
                   <button class="btn-xs" style="color:#ef4444" onclick="deleteSubject(${idx})">삭제</button>
                </div>
              `;
          }

          card.innerHTML = `
              <div class="subj-icon-box">${iconText}</div>
              <div class="subj-info">
                  <div class="subj-title">${sub.name}</div>
                  <div class="subj-meta">${badges}</div>
              </div>
              ${adminHtml}
          `;
          list.appendChild(card);
      });

      // 관리자용 추가 버튼
      if(isAdmin) {
          const addBtn = document.createElement('div');
          addBtn.className = 'subject-card add-subject-card admin-only';
          addBtn.innerHTML = '+ 과정 추가하기';
          addBtn.onclick = () => editSubject('NEW');
          list.appendChild(addBtn);
      }
  }

  /* 뷰어 기능 */
  async function openContent(sub) {
      if(sub.link) {
          window.open(sub.link, '_blank');
          return;
      }
      if(sub.pdfName) {
          // PDF 파일명 처리
          let pdfFile = sub.pdfName;
          if(!pdfFile.toLowerCase().endsWith('.pdf')) pdfFile += '.pdf';
          const url = `files/${pdfFile}`; // files 폴더 경로 가정

          document.getElementById('pdfOverlay').style.display = 'flex';
          const viewer = document.getElementById('viewerBody');
          viewer.innerHTML = '<div style="color:#fff">Loading...</div>';

          try {
              const loadingTask = pdfjsLib.getDocument(url);
              const pdf = await loadingTask.promise;
              viewer.innerHTML = ''; // 초기화
              
              for(let i=1; i<=pdf.numPages; i++) {
                  const page = await pdf.getPage(i);
                  const scale = 1.5;
                  const viewport = page.getViewport({scale});
                  const canvas = document.createElement('canvas');
                  const context = canvas.getContext('2d');
                  canvas.height = viewport.height;
                  canvas.width = viewport.width;
                  viewer.appendChild(canvas);
                  
                  await page.render({canvasContext: context, viewport}).promise;
              }
          } catch(e) {
              alert("PDF 파일을 찾을 수 없습니다: " + url);
              closeViewer();
          }
      } else {
          alert("연결된 콘텐츠가 없습니다.");
      }
  }

  function closeViewer() {
      document.getElementById('pdfOverlay').style.display = 'none';
      document.getElementById('viewerBody').innerHTML = '';
  }

  /* 관리자 기능 */
  function editSubject(idx) {
      currentEditIdx = idx;
      const modal = document.getElementById('editModal');
      
      if(idx === 'NEW') {
          document.getElementById('editName').value = '';
          document.getElementById('editPdf').value = '';
          document.getElementById('editLink').value = '';
      } else {
          const s = subjects[idx];
          document.getElementById('editName').value = s.name;
          document.getElementById('editPdf').value = s.pdfName || '';
          document.getElementById('editLink').value = s.link || '';
      }
      modal.style.display = 'flex';
  }

  function saveSubject() {
      const name = document.getElementById('editName').value;
      const pdf = document.getElementById('editPdf').value;
      const link = document.getElementById('editLink').value;

      if(!name) return alert("과목명을 입력하세요.");

      const newItem = {
          id: Date.now().toString(),
          name: name,
          active: true,
          pdfName: pdf,
          link: link,
          audioName: ""
      };

      if(currentEditIdx === 'NEW') {
          subjects.push(newItem);
      } else {
          // 기존 ID 등 유지하며 업데이트
          subjects[currentEditIdx].name = name;
          subjects[currentEditIdx].pdfName = pdf;
          subjects[currentEditIdx].link = link;
      }

      // 저장
      localStorage.setItem(`kac_subs_${type}_${menuId}`, JSON.stringify(subjects));
      document.getElementById('editModal').style.display = 'none';
      render();
  }

  function deleteSubject(idx) {
      if(confirm("정말 삭제하시겠습니까?")) {
          subjects.splice(idx, 1);
          localStorage.setItem(`kac_subs_${type}_${menuId}`, JSON.stringify(subjects));
          render();
      }
  }

  init();
</script>
</body>
</html>
