<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>과목 리스트 - KAC CNS Training Platform</title>
<!-- 로그인 체크 -->
<script>
  if(sessionStorage.getItem('kac_access_token') !== 'granted') {
    location.replace('login.html');
  }
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  :root { 
    --theme-color: #2563eb; 
    --theme-rgb: 37, 99, 235;

    --navy: #0f172a; --bg-main: #f0f4f8; --bg-card: #ffffff; 
    --text-main: #000000; --text-sub: #334155; 
    --border-card: transparent; --shadow: 0 5px 15px rgba(0,0,0,0.05);
    --btn-bg: #f8fafc; --btn-border: #e2e8f0; --btn-text: #64748b;
    --pill-bg: #f1f5f9; --pill-text: #94a3b8; --pill-border: #e2e8f0;
    --title-color: #1e293b;
    --header-h: 75px;
  }
  body.dark-mode {
    --navy: #020617; --bg-main: #0f172a; --bg-card: #1e293b; 
    --text-main: #f1f5f9; --text-sub: #cbd5e1; 
    --border-card: 1px solid rgba(255,255,255,0.1); 
    --shadow: 0 5px 20px rgba(0,0,0,0.5);
    --btn-bg: rgba(255,255,255,0.05); --btn-border: rgba(255,255,255,0.2); --btn-text: #e2e8f0;
    --pill-bg: rgba(255,255,255,0.05); --pill-text: #cbd5e1; --pill-border: rgba(255,255,255,0.2);
    --title-color: #ffffff;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
  
  html, body { width: 100%; height: 100%; overflow: hidden; }

  body { background: var(--bg-main); display: flex; flex-direction: column; color: var(--text-main); transition: 0.3s; }

  /* 관리자 전용 */
  body:not(.admin-mode) .admin-only { display: none !important; }

  /* 헤더 스타일 (고정) */
  header { 
    height: var(--header-h); background: var(--navy); 
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
    z-index: 1000; flex-shrink: 0; position: fixed; top: 0; left: 0; width: 100%;
  }
  
  .header-left { display: flex; align-items: center; gap: 15px; }
  .logo-text { font-size: 20px; font-weight: 800; cursor: pointer; white-space: nowrap; }
  .header-right { display: flex; align-items: center; gap: 15px; }
  
  .kac-logo-img { height: 30px; width: auto; display: block; object-fit: contain; }
  .breadcrumb { color: rgba(255,255,255,0.7); font-weight: 500; font-size: 16px; margin-left: 10px; white-space: nowrap; display: none; }
  @media(min-width: 1024px) { .breadcrumb { display: inline-block; } }
  
  .theme-toggle { display: flex; gap: 5px; background: rgba(255,255,255,0.1); padding: 5px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.2); margin-right: 10px; }
  .theme-btn { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; opacity: 0.5; }
  .theme-btn.active { background: #fff; opacity: 1; color: var(--navy); }
  .theme-btn svg { width: 16px; height: 16px; fill: currentColor; }

  /* 메인 컨텐츠 영역 (스크롤 가능) */
  .content-wrapper {
      flex: 1; 
      display: flex; flex-direction: column;
      width: 100%; height: 100%;
      padding-top: 100px; /* 헤더 여백 */
      padding-bottom: 0;
      overflow-y: scroll;
      scrollbar-width: none; -ms-overflow-style: none;
      align-items: center;
  }
  .content-wrapper::-webkit-scrollbar { display: none; }

  /* 리스트 컨테이너 */
  #subjectList {
      width: 100%; max-width: 900px;
      padding: 0 20px 40px 20px;
      display: flex; flex-direction: column; gap: 20px;
      flex: 1; /* 남은 공간 차지 (Footer 밀어내기용) */
  }

  /* 카드 디자인 (기존 스타일 유지 + 가로 배치) */
  .subject-card { 
    background: var(--bg-card); width: 100%; padding: 25px 35px; border-radius: 18px; 
    box-shadow: var(--shadow); border: 1px solid transparent;
    display: flex; justify-content: space-between; align-items: center; transition: 0.3s;
    border-left: 10px solid var(--theme-color); 
    cursor: pointer; color: var(--text-main); position: relative;
  }
  .subject-card:hover { transform: translateX(5px); border-color: var(--theme-color); box-shadow: 0 8px 25px rgba(var(--theme-rgb), 0.2); }
  .subject-card.inactive { border-left-color: #94a3b8 !important; opacity: 0.7; background: #f8fafc; }
  
  .subj-title { font-size: 20px; font-weight: 800; color: var(--title-color); }
  .status-group { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .status-pill { font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 6px; background: var(--pill-bg); color: var(--pill-text); border: 1px solid var(--pill-border); }
  .status-pill.on { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
  .status-pill.link { background: #dbeafe; color: #1e40af; border-color: #bfdbfe; }
  
  /* 관리자 버튼 그룹 */
  .ctrl-btns { display: flex; gap: 10px; }
  .btn-action { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--btn-border); background: #fff; font-size: 12px; cursor: pointer; }
  .btn-del { color: #ef4444; border-color: #fee2e2; }

  /* 추가 버튼 */
  .add-card { border: 2px dashed #cbd5e1; background: transparent; justify-content: center; color: #94a3b8; font-weight: 700; padding: 20px; box-shadow: none; }
  .add-card:hover { border-color: var(--theme-color); color: var(--theme-color); background: rgba(var(--theme-rgb), 0.05); transform: none; }

  /* 하단바 (Sticky Footer) */
  .main-footer {
    width: 100%; background: var(--navy); padding: 30px 20px;
    text-align: center; color: rgba(255,255,255,0.7);
    font-size: 13px; line-height: 1.6;
    border-top: 1px solid rgba(255,255,255,0.1); box-sizing: border-box;
    margin-top: auto; /* 내용 적을때 바닥 고정 */
    flex-shrink: 0;
  }
  .main-footer p { margin: 0; word-break: keep-all; }
  .main-footer .copyright { font-weight: 700; margin-top: 8px; color: rgba(255,255,255,0.9); }

  /* 하단 버튼 (뒤로가기/홈) */
  .bottom-nav { 
    display: flex; justify-content: center; gap: 20px; 
    margin: 20px 0; padding: 10px; width: 100%;
  }
  .nav-item { 
    color: #fff; cursor: pointer; font-size: 16px; font-weight: 700; 
    transition: 0.3s; opacity: 1; display: flex; align-items: center; gap: 8px; 
    padding: 10px 30px; border-radius: 50px;
    background: #0f172a; border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  }
  .nav-item:hover { background: #1e293b; transform: translateY(-2px); }
  body.dark-mode .nav-item { background: #1e293b; border-color: rgba(255,255,255,0.3); }

  /* PDF 뷰어 오버레이 */
  #pdfOverlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: none; }
  .close-v { position: absolute; top: 20px; right: 20px; color: #fff; font-size: 30px; cursor: pointer; z-index: 10001; }
  #viewerBody { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; overflow: auto; }
  canvas { max-width: 100%; height: auto; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
  
  /* 모바일 대응 */
  @media (max-width: 768px) {
      .subject-card { flex-direction: column; align-items: flex-start; gap: 15px; }
      .ctrl-btns { width: 100%; justify-content: flex-end; }
      .bottom-nav { margin-bottom: 20px; }
  }

  /* 모달 공통 */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 11000; display: none; align-items: center; justify-content: center; }
  .modal-card { background: var(--bg-card); padding: 30px; border-radius: 20px; width: 400px; }
  .setting-input { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #e2e8f0; }
  .btn-modal { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; margin-top: 5px; }
  .btn-primary { background: #0f172a; color: #fff; }

</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo-text" onclick="location.href='index.html'">KAC CNS Training Platform</div>
    <span class="breadcrumb" id="bc"></span>
  </div>
  <div class="header-right">
    <div class="theme-toggle">
        <div class="theme-btn" id="btnDay" onclick="setTheme('light')">☀️</div>
        <div class="theme-btn" id="btnNight" onclick="setTheme('dark')">🌙</div>
    </div>
    <img src="logo.png" alt="KAC Logo" class="kac-logo-img">
  </div>
</header>

<div class="content-wrapper">
  
  <!-- 과목 리스트 (스크롤) -->
  <div id="subjectList">
    <!-- JS로 카드 생성됨 -->
  </div>

  <!-- 하단 버튼 -->
  <div class="bottom-nav">
    <div class="nav-item" onclick="history.back()">
      <svg style="width:20px;height:20px;fill:currentColor" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      뒤로가기
    </div>
    <div class="nav-item" onclick="location.href='index.html'">
      <svg style="width:20px;height:20px;fill:currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      홈으로
    </div>
  </div>

  <!-- 하단바 -->
  <footer class="main-footer">
    <div class="footer-content"></div>
  </footer>

</div>

<!-- PDF 뷰어 -->
<div id="pdfOverlay">
  <div class="close-v" onclick="closeViewer()">✕</div>
  <div id="viewerBody"></div>
</div>

<!-- 수정/추가 모달 -->
<div id="editModal" class="modal-overlay">
  <div class="modal-card">
    <h3>📝 과목 수정/추가</h3>
    <input type="text" id="editName" class="setting-input" placeholder="과목명">
    <input type="text" id="editPdf" class="setting-input" placeholder="PDF 파일명 (예: CH1)">
    <input type="text" id="editLink" class="setting-input" placeholder="외부 링크 URL">
    <button class="btn-modal btn-primary" onclick="saveSubject()">저장</button>
    <button class="btn-modal" style="background:#e2e8f0" onclick="document.getElementById('editModal').style.display='none'">취소</button>
  </div>
</div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js";
  
  const params = new URLSearchParams(location.search);
  const type = params.get('type'); 
  const menuLabel = params.get('menu');
  const menuId = params.get('id');
  
  let isAdmin = localStorage.getItem('kac_admin_mode') === '1';
  let subjects = [];
  let currentEditIdx = -1;

  async function init() {
      const theme = localStorage.getItem('kac_theme') || 'light';
      setTheme(theme);

      if(isAdmin) document.body.classList.add('admin-mode');

      loadStyleData();
      loadSubjects();
      loadFooterText();
      render();
  }
  
  function setTheme(m) { 
      document.body.classList.toggle('dark-mode', m==='dark'); 
      localStorage.setItem('kac_theme', m);
      document.getElementById('btnDay').classList.toggle('active', m==='light'); 
      document.getElementById('btnNight').classList.toggle('active', m==='dark'); 
  }

  function loadStyleData() {
      const sData = localStorage.getItem(`kac_style_${type}`);
      const style = sData ? JSON.parse(sData) : { name: type, color: '#2563eb' };
      
      document.documentElement.style.setProperty('--theme-color', style.color || '#2563eb');
      const rgb = hexToRgb(style.color || '#2563eb');
      document.documentElement.style.setProperty('--theme-rgb', rgb);

      // 브레드크럼 설정
      const bc = document.getElementById('bc');
      if(bc) bc.innerHTML = ` > ${style.name} > ${decodeURIComponent(menuLabel)}`;
  }
  
  function hexToRgb(hex) {
    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : '37, 99, 235';
  }

  function loadSubjects() {
      const key = `kac_subs_${type}_${menuId}`;
      const data = localStorage.getItem(key);
      subjects = data ? JSON.parse(data) : [];
  }
  
  function loadFooterText() {
      const savedText = localStorage.getItem('kac_full_footer');
      const defaultText = "<p>본 웹사이트는 한국공항공사 항공기술훈련원의 항행안전시설 분야 교육 관련 플랫폼입니다.</p><p>문의 이메일 : jds0616@airport.co.kr (Developed by DooSeok, Jang)</p><p class='copyright'>© 2026 Korea Airports Corporation. All rights reserved.</p>";
      document.querySelector('.footer-content').innerHTML = savedText || defaultText;
  }

  function render() {
      const list = document.getElementById('subjectList');
      list.innerHTML = '';

      if(subjects.length === 0 && !isAdmin) {
          list.innerHTML = `<div style="text-align:center; color:#94a3b8; padding:50px;">등록된 과정이 없습니다.</div>`;
          return;
      }

      subjects.forEach((sub, idx) => {
          if(!sub.active && !isAdmin) return; 

          const card = document.createElement('div');
          card.className = sub.active ? 'subject-card' : 'subject-card inactive';
          card.onclick = () => openContent(sub);

          let badges = '';
          if(sub.pdfName) badges += `<span class="status-pill on">📄 PDF</span>`;
          if(sub.link) badges += `<span class="status-pill link">🔗 Link</span>`;

          let adminHtml = '';
          if(isAdmin) {
              adminHtml = `
                <div class="ctrl-btns admin-only" onclick="event.stopPropagation()">
                   <button class="btn-action" onclick="editSubject(${idx})">수정</button>
                   <button class="btn-action btn-del" onclick="deleteSubject(${idx})">삭제</button>
                </div>
              `;
          }

          card.innerHTML = `
              <div>
                  <div class="subj-title">${sub.name}</div>
                  <div class="status-group">${badges}</div>
              </div>
              ${adminHtml}
          `;
          list.appendChild(card);
      });

      if(isAdmin) {
          const addBtn = document.createElement('div');
          addBtn.className = 'subject-card add-card admin-only';
          addBtn.innerHTML = '+ 새로운 교육 과정(Subject) 추가';
          addBtn.onclick = () => editSubject('NEW');
          list.appendChild(addBtn);
      }
  }

  /* 뷰어 기능 */
  async function openContent(sub) {
      if(sub.link) {
          window.open(sub.link, '_blank');
          return;
      }
      if(sub.pdfName) {
          let pdfFile = sub.pdfName;
          if(!pdfFile.toLowerCase().endsWith('.pdf')) pdfFile += '.pdf';
          const url = `files/${pdfFile}`; 

          document.getElementById('pdfOverlay').style.display = 'flex';
          const viewer = document.getElementById('viewerBody');
          viewer.innerHTML = '<div style="color:#fff">Loading...</div>';

          try {
              const loadingTask = pdfjsLib.getDocument(url);
              const pdf = await loadingTask.promise;
              viewer.innerHTML = ''; 
              
              for(let i=1; i<=pdf.numPages; i++) {
                  const page = await pdf.getPage(i);
                  const scale = 1.5;
                  const viewport = page.getViewport({scale});
                  const canvas = document.createElement('canvas');
                  const context = canvas.getContext('2d');
                  canvas.height = viewport.height;
                  canvas.width = viewport.width;
                  viewer.appendChild(canvas);
                  
                  await page.render({canvasContext: context, viewport}).promise;
              }
          } catch(e) {
              alert("PDF 파일을 찾을 수 없습니다: " + url);
              closeViewer();
          }
      } else {
          alert("연결된 콘텐츠가 없습니다.");
      }
  }

  function closeViewer() {
      document.getElementById('pdfOverlay').style.display = 'none';
      document.getElementById('viewerBody').innerHTML = '';
  }

  /* 관리자 기능 */
  function editSubject(idx) {
      currentEditIdx = idx;
      const modal = document.getElementById('editModal');
      
      if(idx === 'NEW') {
          document.getElementById('editName').value = '';
          document.getElementById('editPdf').value = '';
          document.getElementById('editLink').value = '';
      } else {
          const s = subjects[idx];
          document.getElementById('editName').value = s.name;
          document.getElementById('editPdf').value = s.pdfName || '';
          document.getElementById('editLink').value = s.link || '';
      }
      modal.style.display = 'flex';
  }

  function saveSubject() {
      const name = document.getElementById('editName').value;
      const pdf = document.getElementById('editPdf').value;
      const link = document.getElementById('editLink').value;

      if(!name) return alert("과목명을 입력하세요.");

      const newItem = {
          id: Date.now().toString(),
          name: name,
          active: true,
          pdfName: pdf,
          link: link,
          audioName: ""
      };

      if(currentEditIdx === 'NEW') {
          subjects.push(newItem);
      } else {
          subjects[currentEditIdx].name = name;
          subjects[currentEditIdx].pdfName = pdf;
          subjects[currentEditIdx].link = link;
      }

      localStorage.setItem(`kac_subs_${type}_${menuId}`, JSON.stringify(subjects));
      document.getElementById('editModal').style.display = 'none';
      render();
  }

  function deleteSubject(idx) {
      if(confirm("정말 삭제하시겠습니까?")) {
          subjects.splice(idx, 1);
          localStorage.setItem(`kac_subs_${type}_${menuId}`, JSON.stringify(subjects));
          render();
      }
  }

  init();
</script>
</body>
</html>
