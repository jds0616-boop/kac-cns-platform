<script>
  const params = new URLSearchParams(location.search);
  const type = params.get('type');
  let isAdmin = localStorage.getItem('kac_admin_mode') === '1';
  let isPreview = localStorage.getItem('kac_preview_active') === '1';
  let menus = [], currentEditIdx = -1, currentPage = 1, dragSrcIndex = null;
  const itemsPerPage = 8;
  
  let globalSecurity = { admin_pw: "db2d3257df630ebeb488b0a9435b863702a0a25694205626359045b8427f311c" };

  async function init() {
    setTheme(localStorage.getItem('kac_theme') || 'light');
    
    let serverData = null;
    try {
        const res = await fetch('data.json?v=' + Date.now());
        if(res.ok) serverData = await res.json();
    } catch(e) {}

    const isAdminSession = localStorage.getItem('kac_admin_mode') === '1';
    const hasLocalData = localStorage.getItem('kac_index_order');

    if (isAdminSession && hasLocalData) {
        if(serverData && serverData.security) globalSecurity = serverData.security;
    } else if (serverData) {
        if(serverData.security) globalSecurity = serverData.security;
        syncToLocalStorage(serverData);
    }

    document.getElementById('loadingSpinner').style.opacity = '0';
    setTimeout(() => document.getElementById('loadingSpinner').style.display='none', 500);

    loadMenuData();
    render(); 
    buildSearchIndex();
  }

  function syncToLocalStorage(data) {
    const order = [];
    data.categories.forEach(cat => {
      if(cat) {
        order.push(cat.id);
        localStorage.setItem(`kac_style_${cat.id}`, JSON.stringify({ name: cat.name, code: cat.code, color: cat.color }));
        const mData = cat.menus.map(m => ({ dataId: m.id, label: m.label, line1: m.line1, line2: m.line2, link: m.link }));
        localStorage.setItem(`kac_menu_${cat.id}`, JSON.stringify(mData));
        cat.menus.forEach(m => localStorage.setItem(`kac_subs_${cat.id}_${m.id}`, JSON.stringify(m.subjects)));
      } else { order.push(null); }
    });
    localStorage.setItem('kac_index_order', JSON.stringify(order));
  }

  function loadMenuData() {
    const saved = localStorage.getItem(`kac_menu_${type}`);
    menus = saved ? JSON.parse(saved) : [];
    const sData = localStorage.getItem(`kac_style_${type}`), style = sData ? JSON.parse(sData) : { name: type, color: '#2563eb' };
    document.getElementById('bc').textContent = ` > ${style.name || type}`;
    document.documentElement.style.setProperty('--theme-color', style.color || '#2563eb');
    document.documentElement.style.setProperty('--theme-rgb', hexToRgb(style.color || '#2563eb'));
  }
  
  function hexToRgb(hex) {
    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : '37, 99, 235';
  }

  function render() {
    const grid = document.getElementById('trainGrid'), paginCont = document.getElementById('pagination');
    grid.innerHTML = ''; paginCont.innerHTML = '';
    
    let list = [...menus]; 
    if(isAdmin && !isPreview) list.push({ isAddButton: true });

    const totalPages = Math.ceil(list.length / itemsPerPage) || 1;
    const start = (currentPage - 1) * itemsPerPage, pageItems = list.slice(start, start + itemsPerPage);

    pageItems.forEach((item, idx) => {
      const globalIdx = start + idx, card = document.createElement('div');
      card.className = item.isAddButton ? 'menu-card add-btn-wrap' : 'menu-card';
      
      if(item.isAddButton) {
        card.innerHTML = `<div class="icon-circle" style="background:none; border:2px dashed #cbd5e1; color:#cbd5e1">+</div><div style="color:#94a3b8; font-weight:800;">메뉴 추가</div>`;
        card.onclick = () => openIndividualEdit('NEW');
      } else {
        const ctrl = (isAdmin && !isPreview) ? `<div class="admin-ctrl" onclick="event.stopPropagation()"><button class="btn-sm" onclick="openIndividualEdit(${globalIdx})">수정</button><button class="btn-sm btn-del" onclick="deleteItem(${globalIdx})">삭제</button></div>` : '';
        const l1 = item.line1 || '', l2 = item.line2 ? `<div>${item.line2}</div>` : '';
        card.innerHTML = `<div class="icon-circle"><div>${l1}</div>${l2}</div><div class="menu-label">${item.label || '제목없음'}</div>${ctrl}`;
        card.onclick = () => item.link ? window.open(item.link, '_blank') : location.href = `viewer_list.html?type=${type}&menu=${encodeURIComponent(item.label)}&id=${item.dataId}`;
      }
      grid.appendChild(card);
    });

    if(totalPages > 1) {
      for(let i=1; i<=totalPages; i++) {
        const dot = document.createElement('div');
        dot.className = `page-dot ${i === currentPage ? 'active' : ''}`;
        dot.textContent = i;
        dot.onclick = () => { currentPage = i; render(); };
        paginCont.appendChild(dot);
      }
    }
  }

  // [수정] 모달 열 때 기존 데이터 채우기
  function openIndividualEdit(idx) { 
    currentEditIdx = idx; 
    if(idx === 'NEW') {
        ['editItemLine1','editItemLine2','editItemLabel','editItemLink'].forEach(id => document.getElementById(id).value = ''); 
    } else { 
        const m = menus[idx]; 
        document.getElementById('editItemLine1').value = m.line1 || ''; 
        document.getElementById('editItemLine2').value = m.line2 || ''; 
        document.getElementById('editItemLabel').value = m.label || ''; 
        document.getElementById('editItemLink').value = m.link || ''; 
    } 
    document.getElementById('itemEditModal').style.display = 'flex'; 
  }

  function saveIndividualEdit() { 
    const data = { 
        line1: document.getElementById('editItemLine1').value, 
        line2: document.getElementById('editItemLine2').value, 
        label: document.getElementById('editItemLabel').value, 
        link: document.getElementById('editItemLink').value, 
        dataId: (currentEditIdx === 'NEW' ? 'id_' + Date.now() : menus[currentEditIdx].dataId) 
    }; 
    if(currentEditIdx === 'NEW') menus.push(data); 
    else menus[currentEditIdx] = data; 
    saveData(); 
    closeModal('itemEditModal'); 
  }

  function saveData() { localStorage.setItem(`kac_menu_${type}`, JSON.stringify(menus)); render(); buildSearchIndex(); }
  function closeModal(id) { document.getElementById(id).style.display = 'none'; }
  function setTheme(m) { document.body.classList.toggle('dark-mode', m==='dark'); localStorage.setItem('kac_theme', m); const bD = document.getElementById('btnDay'), bN = document.getElementById('btnNight'); if(bD) bD.classList.toggle('active', m==='light'); if(bN) bN.classList.toggle('active', m==='dark'); }
  function openSettings() { document.getElementById('adminSettings').style.display = isAdmin ? 'block' : 'none'; document.getElementById('settingsModal').style.display = 'flex'; }
  function togglePreview() { isPreview = !isPreview; localStorage.setItem('kac_preview_active', isPreview ? '1' : '0'); location.reload(); }
  async function toggleAdmin() { if(isAdmin) { localStorage.setItem('kac_admin_mode','0'); location.reload(); } }
  function deleteItem(idx) { if(confirm('삭제하시겠습니까?')) { menus.splice(idx,1); saveData(); } }

  function buildSearchIndex() { 
    const order = JSON.parse(localStorage.getItem('kac_index_order') || '[]');
    order.forEach(tid => { if(!tid) return; const ms = JSON.parse(localStorage.getItem(`kac_menu_${tid}`) || '[]'); ms.forEach(m => { /* 검색 인덱싱 로직 */ }); });
  }

  init();
</script>
</body>
</html>
