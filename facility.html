<!DOCTYPE html>
<html lang="ko">
<head>
<script>
  // [보안] 로그인 세션 체크
  if(sessionStorage.getItem('kac_access_token') !== 'granted') {
    alert("로그인이 필요합니다.");
    location.replace('login.html');
  }
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>시설 상세 관리 - KAC CNS Training Platform</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  :root { 
    --theme-color: #2563eb; --theme-rgb: 37, 99, 235;
    --navy: #0f172a; --bg-main: #f0f4f8; --bg-card: #ffffff; 
    --text-main: #000000; --text-sub: #334155; 
    --border-card: 2px solid transparent; 
    --shadow: 0 10px 25px rgba(0,0,0,0.05);
    --btn-bg: #f8fafc; --btn-border: #e2e8f0; --btn-text: #64748b;
    --header-h: 75px;
  }
  body.dark-mode {
    --navy: #020617; --bg-main: #0f172a; --bg-card: #1e293b; 
    --text-main: #f1f5f9; --text-sub: #cbd5e1; 
    --border-card: 2px solid rgba(255,255,255,0.1); 
    --shadow: 0 10px 30px rgba(0,0,0,0.5);
    --btn-bg: rgba(255,255,255,0.05); --btn-border: rgba(255,255,255,0.2); --btn-text: #e2e8f0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
  
  html, body { width: 100%; height: 100%; overflow: hidden; }

  body { 
    background: var(--bg-main); display: flex; flex-direction: column; 
    color: var(--text-main); transition: background 0.3s, color 0.3s; 
  }

  /* 모달 스타일 */
  .modal-overlay { 
      position: fixed; inset: 0; background: rgba(0,0,0,0.7); 
      z-index: 9999; display: none !important; 
      align-items: center; justify-content: center; 
  }
  .modal-overlay[style*="display: flex"] { display: flex !important; }
  .modal-card { background: var(--bg-card); padding: 30px; border-radius: 20px; width: 400px; color: var(--text-main); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
  .modal-title { font-size: 20px; font-weight: 800; margin-bottom: 20px; border-bottom: 1px solid var(--btn-border); padding-bottom: 10px; }
  .setting-group { margin-bottom: 15px; }
  .setting-label { font-size: 12px; font-weight: 700; color: var(--text-sub); margin-bottom: 5px; display: block; }
  .setting-input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--btn-border); background: var(--btn-bg); color: var(--text-main); font-size: 14px; outline: none; }
  .btn-row { display: flex; gap: 10px; margin-top: 20px; }
  .btn-modal { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: 700; cursor: pointer; }
  .btn-primary { background: var(--navy); color: #fff; }
  .btn-secondary { background: var(--btn-border); color: var(--text-sub); }

  /* 헤더 스타일 */
  header { 
    height: var(--header-h); background: var(--navy); 
    display: flex; align-items: center; justify-content: space-between; 
    padding: 0 20px; color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.15); 
    z-index: 1000; flex-shrink: 0; 
  }
  .header-left { display: flex; align-items: center; gap: 15px; font-weight: 800; font-size: 20px; cursor: pointer; }
  .header-right { display: flex; gap: 10px; }
  .theme-btn, .settings-btn { padding: 8px; border-radius: 50%; background: rgba(255,255,255,0.1); cursor: pointer; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }

  /* 레이아웃 컨테이너 (좌측 고정 + 우측 리스트) */
  .layout-container {
      display: flex;
      width: 100%; height: calc(100% - var(--header-h));
      max-width: 1400px; margin: 0 auto;
      padding: 40px 20px;
      gap: 50px;
      justify-content: center;
      position: relative;
  }

  /* 좌측 대표 카드 패널 */
  .left-panel {
      width: 280px; flex-shrink: 0;
      display: flex; flex-direction: column; 
      align-items: flex-end; /* 우측 정렬하여 타임라인과 가깝게 */
      padding-top: 20px;
      position: relative;
  }

  /* 홈 카드 스타일 (통합 버튼화) */
  .home-card {
      width: 100%;
      background: var(--bg-card);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      border: 3px solid var(--theme-color); /* 테두리 색상 */
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      position: sticky; top: 40px;
      display: flex; flex-direction: column;
  }
  .home-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(var(--theme-rgb), 0.25);
  }

  .home-card-body {
      padding: 40px 20px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: var(--bg-card);
  }

  .home-icon-box {
      width: 80px; height: 80px;
      border-radius: 25px;
      background: #f1f5f9;
      color: var(--theme-color);
      font-size: 36px; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 20px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
  }

  .home-title {
      font-size: 24px; font-weight: 800;
      color: var(--text-main);
      text-align: center;
  }

  /* 하단 홈으로 이동 버튼 영역 */
  .home-btn-area {
      width: 100%;
      padding: 18px;
      background: #fff; /* 밝은 배경 */
      border-top: 1px solid rgba(0,0,0,0.05);
      display: flex; align-items: center; justify-content: center; gap: 10px;
      color: var(--theme-color); /* 테마 색상 적용 */
      font-size: 18px; /* 글자 키움 */
      font-weight: 800; /* 굵게 */
      transition: background 0.2s;
  }
  .home-card:hover .home-btn-area {
      background: #f8fafc;
      text-decoration: underline; 
      text-underline-offset: 4px;
  }
  .home-btn-area svg { width: 24px; height: 24px; fill: currentColor; } /* 아이콘 키움 */
  
  body.dark-mode .home-btn-area { background: #1e293b; border-top-color: rgba(255,255,255,0.1); }
  body.dark-mode .home-card:hover .home-btn-area { background: #334155; }
  body.dark-mode .home-icon-box { background: rgba(255,255,255,0.05); }

  /* 우측 타임라인 리스트 패널 */
  .right-panel {
      flex: 1; max-width: 800px;
      overflow-y: auto;
      padding-right: 10px; /* 스크롤바 여백 */
      padding-left: 30px;
      position: relative;
  }

  /* 타임라인 세로선 */
  .timeline-line {
      position: absolute; left: 0; top: 40px; bottom: 40px;
      width: 4px; border-radius: 4px;
      background: rgba(var(--theme-rgb), 0.2);
  }

  /* 메뉴 아이템 래퍼 */
  .menu-wrapper {
      position: relative;
      margin-bottom: 25px;
      width: 100%;
  }

  /* 타임라인 연결 점 */
  .timeline-dot {
      position: absolute; left: -36px; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--bg-card);
      border: 4px solid var(--theme-color);
      z-index: 2;
  }
  /* 타임라인 가로선 */
  .timeline-connect {
      position: absolute; left: -30px; top: 50%; transform: translateY(-50%);
      width: 30px; height: 4px;
      background: rgba(var(--theme-rgb), 0.2);
      z-index: 1;
  }

  /* 메뉴 카드 스타일 */
  .menu-card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 20px 25px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      display: flex; align-items: center; justify-content: space-between;
      border: 2px solid transparent; /* 호버 시 테두리용 */
      transition: 0.2s;
      cursor: pointer;
      border-left: 6px solid var(--theme-color);
  }
  .menu-card:hover {
      transform: translateX(5px);
      box-shadow: 0 8px 25px rgba(var(--theme-rgb), 0.15);
  }

  /* 드래그 앤 드롭 스타일 */
  .menu-wrapper.dragging { opacity: 0.4; }
  .menu-wrapper.drag-over .menu-card {
      border: 2px dashed var(--theme-color);
      transform: scale(1.02);
      background: rgba(var(--theme-rgb), 0.05);
  }

  .menu-info { display: flex; align-items: center; gap: 20px; flex: 1; }
  
  .menu-pill {
      background: rgba(var(--theme-rgb), 0.1);
      color: var(--theme-color);
      padding: 8px 16px; border-radius: 50px;
      font-weight: 900; font-size: 16px;
      min-width: 80px; text-align: center;
      border: 1px solid rgba(var(--theme-rgb), 0.2);
  }
  
  .menu-title { font-size: 18px; font-weight: 700; color: var(--text-main); }
  .ext-link-icon { font-size: 14px; color: #94a3b8; margin-left: 5px; }

  /* 관리자 컨트롤 버튼 */
  .admin-ctrl { display: flex; gap: 8px; opacity: 0.8; }
  .btn-sm { 
      padding: 6px 12px; font-size: 12px; border-radius: 6px; 
      border: 1px solid var(--btn-border); background: var(--btn-bg); 
      font-weight: 700; cursor: pointer; color: var(--btn-text); 
      transition: 0.2s;
  }
  .btn-sm:hover { background: #fff; border-color: var(--theme-color); color: var(--theme-color); }
  .btn-del { color: #ef4444; border-color: #fee2e2; }
  .btn-del:hover { background: #fee2e2; color: #b91c1c; border-color: #b91c1c; }
  .btn-move { color: #3b82f6; border-color: #dbeafe; }
  .btn-move:hover { background: #dbeafe; color: #1d4ed8; }

  /* 새 메뉴 추가 버튼 */
  .add-btn-wrap {
      width: 100%; padding: 20px;
      border: 2px dashed #cbd5e1;
      border-radius: 16px;
      color: #94a3b8; font-weight: 700;
      text-align: center; cursor: pointer;
      transition: 0.2s; margin-top: 20px;
      background: transparent;
  }
  .add-btn-wrap:hover {
      border-color: var(--theme-color); color: var(--theme-color); background: rgba(var(--theme-rgb), 0.05);
  }

  body.preview-active .admin-ctrl, body.preview-active .add-btn-wrap { display: none !important; }

  @media (max-width: 800px) {
      .layout-container { flex-direction: column; align-items: center; gap: 30px; }
      .left-panel { width: 100%; align-items: center; position: static; }
      .home-card { width: 100%; max-width: 400px; }
      .right-panel { padding-left: 20px; width: 100%; }
      .timeline-dot { left: -26px; }
      .timeline-connect { width: 20px; left: -20px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left" onclick="location.href='index.html'">KAC CNS Training Platform</div>
  <div class="header-right">
    <div class="theme-btn" onclick="toggleTheme()">🌗</div>
    <div class="settings-btn" onclick="openSettings()">⚙️</div>
  </div>
</header>

<div class="layout-container">
  <!-- 좌측 패널: 대표 카드 (통합 버튼) -->
  <div class="left-panel">
      <!-- 이 카드 전체가 클릭 가능 -->
      <div class="home-card" onclick="location.href='index.html'">
          <div class="home-card-body">
              <div class="home-icon-box" id="facIcon">N</div>
              <div class="home-title" id="facTitle">항법시설</div>
          </div>
          <!-- 하단 통합 버튼 영역 (크고 잘 보이게) -->
          <div class="home-btn-area">
              <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
              홈으로 이동
          </div>
      </div>
  </div>

  <!-- 우측 패널: 타임라인 리스트 -->
  <div class="right-panel">
      <div class="timeline-line"></div>
      <div id="menuList">
          <!-- JS로 동적 생성됨 -->
      </div>
  </div>
</div>

<!-- 모달들 -->
<div id="itemEditModal" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <div class="modal-title">📦 메뉴 수정</div>
    <div class="setting-group"><label class="setting-label">아이콘 (Pill)</label><input type="text" id="editItemLine1" class="setting-input"></div>
    <div class="setting-group"><label class="setting-label">메뉴 명칭</label><input type="text" id="editItemLabel" class="setting-input"></div>
    <div class="setting-group"><label class="setting-label">외부 링크 (선택)</label><input type="text" id="editItemLink" class="setting-input" placeholder="https://..."></div>
    <div class="btn-row">
      <button class="btn-modal btn-primary" onclick="saveIndividualEdit()">저장</button>
      <button class="btn-modal btn-secondary" onclick="closeModal('itemEditModal')">취소</button>
    </div>
  </div>
</div>

<!-- 이동 모달 (Category Move) -->
<div id="moveMenuModal" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <div class="modal-title">📂 소속 이동</div>
    <p style="margin-bottom:15px; font-size:13px; color:var(--text-sub);">
        선택한 메뉴를 다른 시설 카테고리로 이동합니다.<br>
        (하위 과목 데이터도 함께 이동됩니다.)
    </p>
    <div class="setting-group">
        <label class="setting-label">이동할 목적지 선택</label>
        <select id="moveTargetCategory" class="setting-input" style="height:45px;"></select>
    </div>
    <div class="btn-row">
      <button class="btn-modal btn-primary" onclick="executeMoveMenu()">이동 확인</button>
      <button class="btn-modal btn-secondary" onclick="closeModal('moveMenuModal')">취소</button>
    </div>
  </div>
</div>

<div id="settingsModal" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <div class="modal-title">⚙️ 설정</div>
    <div id="guestSettings" style="display:none;">
      <button class="btn-modal btn-primary" onclick="toggleAdmin()">관리자 로그인</button>
    </div>
    <div id="adminSettings" style="display:none;">
        <div style="margin-bottom:15px;">
            <button class="btn-modal btn-secondary" onclick="togglePreview()" id="previewBtn">미리보기 모드</button>
            <button class="btn-modal btn-danger" style="margin-top:10px;" onclick="toggleAdmin()">로그아웃</button>
        </div>
    </div>
    <button class="btn-modal btn-secondary" onclick="closeModal('settingsModal')" style="margin-top:10px;">닫기</button>
  </div>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const type = params.get('type');
  let isAdmin = localStorage.getItem('kac_admin_mode') === '1';
  let isPreview = localStorage.getItem('kac_preview_active') === '1';
  let menus = [], currentEditIdx = -1;
  let dragSrcIndex = null; // 드래그 앤 드롭용 인덱스

  async function init() {
    setTheme(localStorage.getItem('kac_theme') || 'light');
    if(isPreview) document.body.classList.add('preview-active');
    
    // 스타일 정보 로드
    const sData = localStorage.getItem(`kac_style_${type}`);
    const style = sData ? JSON.parse(sData) : { name: type || '시설 관리', code: 'F', color: '#2563eb' };
    
    // 좌측 카드 정보 업데이트
    document.getElementById('facTitle').textContent = style.name;
    document.getElementById('facIcon').textContent = style.code || type.charAt(0);
    
    document.documentElement.style.setProperty('--theme-color', style.color || '#2563eb');
    document.documentElement.style.setProperty('--theme-rgb', hexToRgb(style.color || '#2563eb'));

    loadMenuData();
    render();
  }

  function loadMenuData() {
      try {
          const saved = localStorage.getItem(`kac_menu_${type}`);
          menus = saved ? JSON.parse(saved) : [];
      } catch(e) { menus = []; }
  }

  // 렌더링 함수 (타임라인 리스트)
  function render() {
      const list = document.getElementById('menuList');
      list.innerHTML = '';

      menus.forEach((item, idx) => {
          const wrapper = document.createElement('div');
          wrapper.className = 'menu-wrapper';
          
          // 드래그 앤 드롭 속성 (관리자 모드일 때만)
          if(isAdmin && !isPreview) {
              wrapper.setAttribute('draggable', 'true');
              wrapper.ondragstart = (e) => handleDragStart(e, idx);
              wrapper.ondragover = (e) => handleDragOver(e);
              wrapper.ondrop = (e) => handleDrop(e, idx);
              wrapper.ondragend = (e) => handleDragEnd(e);
          }

          const dot = document.createElement('div'); dot.className = 'timeline-dot';
          const conn = document.createElement('div'); conn.className = 'timeline-connect';
          
          const card = document.createElement('div');
          card.className = 'menu-card';
          
          // 클릭 이벤트
          card.onclick = () => {
              if(item.link) window.open(item.link, '_blank');
              else location.href = `viewer_list.html?type=${type}&menu=${encodeURIComponent(item.label)}&id=${item.dataId}`;
          };

          const linkIcon = item.link ? `<span class="ext-link-icon">↗</span>` : '';

          // 관리자 컨트롤 버튼
          const ctrl = (isAdmin && !isPreview) ? `
            <div class="admin-ctrl" onclick="event.stopPropagation()">
                <button class="btn-sm" onclick="openIndividualEdit(${idx})">수정</button>
                <button class="btn-sm btn-move" onclick="openMoveMenuModal(${idx})">이동</button>
                <button class="btn-sm btn-del" onclick="deleteItem(${idx})">삭제</button>
            </div>
          ` : '';

          card.innerHTML = `
            <div class="menu-info">
                <div class="menu-pill">${item.line1 || 'TAG'}</div>
                <div class="menu-title">${item.label}${linkIcon}</div>
            </div>
            ${ctrl}
          `;

          wrapper.appendChild(dot);
          wrapper.appendChild(conn);
          wrapper.appendChild(card);
          list.appendChild(wrapper);
      });

      // 새 메뉴 추가 버튼 (관리자용)
      if(isAdmin && !isPreview) {
          const addBtn = document.createElement('div');
          addBtn.className = 'add-btn-wrap';
          addBtn.innerHTML = '+ 새 메뉴 추가';
          addBtn.onclick = () => openIndividualEdit('NEW');
          list.appendChild(addBtn);
      }
  }

  // --- 드래그 앤 드롭 로직 ---
  function handleDragStart(e, idx) {
      dragSrcIndex = idx;
      e.target.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
  }

  function handleDragOver(e) {
      e.preventDefault(); // 드롭 허용
      e.dataTransfer.dropEffect = 'move';
      const wrapper = e.target.closest('.menu-wrapper');
      if(wrapper) wrapper.classList.add('drag-over');
  }

  function handleDragEnd(e) {
      document.querySelectorAll('.menu-wrapper').forEach(w => {
          w.classList.remove('dragging');
          w.classList.remove('drag-over');
      });
  }

  function handleDrop(e, targetIdx) {
      e.stopPropagation();
      const wrapper = e.target.closest('.menu-wrapper');
      if(wrapper) wrapper.classList.remove('drag-over');

      if(dragSrcIndex !== null && dragSrcIndex !== targetIdx) {
          // 배열 순서 변경
          const movedItem = menus.splice(dragSrcIndex, 1)[0];
          menus.splice(targetIdx, 0, movedItem);
          
          saveData();
          render(); // 재렌더링
      }
      return false;
  }

  // --- CRUD 기능 ---
  function openIndividualEdit(idx) {
      currentEditIdx = idx;
      if(idx === 'NEW') {
          document.getElementById('editItemLine1').value = '';
          document.getElementById('editItemLabel').value = '';
          document.getElementById('editItemLink').value = '';
      } else {
          const m = menus[idx];
          document.getElementById('editItemLine1').value = m.line1 || '';
          document.getElementById('editItemLabel').value = m.label || '';
          document.getElementById('editItemLink').value = m.link || '';
      }
      document.getElementById('itemEditModal').style.display = 'flex';
  }

  function saveIndividualEdit() {
      const line1 = document.getElementById('editItemLine1').value;
      const label = document.getElementById('editItemLabel').value;
      const link = document.getElementById('editItemLink').value;
      
      const newData = {
          line1, label, link,
          dataId: (currentEditIdx === 'NEW' ? 'id_' + Date.now() : menus[currentEditIdx].dataId)
      };

      if(currentEditIdx === 'NEW') menus.push(newData);
      else menus[currentEditIdx] = newData;

      saveData();
      closeModal('itemEditModal');
  }

  function deleteItem(idx) {
      if(confirm("정말 삭제하시겠습니까?\n(하위 데이터도 모두 삭제됩니다)")) {
          menus.splice(idx, 1);
          saveData();
      }
  }

  // --- 메뉴 이동 (Category Move) 로직 ---
  function openMoveMenuModal(idx) {
      currentEditIdx = idx;
      const select = document.getElementById('moveTargetCategory');
      select.innerHTML = '';
      
      const order = JSON.parse(localStorage.getItem('kac_index_order') || '[]');
      
      order.forEach(tid => {
          if(!tid || tid === type) return; // 자기 자신 제외
          const style = JSON.parse(localStorage.getItem(`kac_style_${tid}`) || '{}');
          const opt = document.createElement('option');
          opt.value = tid;
          opt.textContent = style.name || tid;
          select.appendChild(opt);
      });

      if(select.options.length === 0) {
          alert("이동할 수 있는 다른 시설 카테고리가 없습니다.");
          return;
      }
      
      document.getElementById('moveMenuModal').style.display = 'flex';
  }

  function executeMoveMenu() {
      const targetType = document.getElementById('moveTargetCategory').value;
      if(!targetType) return;

      // 1. 현재 목록에서 제거
      const itemToMove = menus.splice(currentEditIdx, 1)[0];
      
      // 2. 하위 데이터(과목) 키 변경 및 이동
      // 기존 키: kac_subs_{현재타입}_{아이디} -> 새 키: kac_subs_{타겟타입}_{아이디}
      const oldSubKey = `kac_subs_${type}_${itemToMove.dataId}`;
      const newSubKey = `kac_subs_${targetType}_${itemToMove.dataId}`;
      
      const subData = localStorage.getItem(oldSubKey);
      if(subData) {
          localStorage.setItem(newSubKey, subData); // 새 위치에 저장
          localStorage.removeItem(oldSubKey);       // 기존 위치 삭제
      }

      // 3. 타겟 카테고리 배열에 추가
      const targetMenus = JSON.parse(localStorage.getItem(`kac_menu_${targetType}`) || '[]');
      targetMenus.push(itemToMove);
      localStorage.setItem(`kac_menu_${targetType}`, JSON.stringify(targetMenus));

      // 4. 현재 변경사항 저장
      saveData();
      
      alert(`[${itemToMove.label}] 메뉴가 이동되었습니다.`);
      closeModal('moveMenuModal');
  }

  function saveData() {
      localStorage.setItem(`kac_menu_${type}`, JSON.stringify(menus));
      render();
  }

  function closeModal(id) { document.getElementById(id).style.display = 'none'; }
  
  // 유틸리티
  function openSettings() {
      const gSet = document.getElementById('guestSettings');
      const aSet = document.getElementById('adminSettings');
      gSet.style.display = isAdmin ? 'none' : 'block';
      aSet.style.display = isAdmin ? 'block' : 'none';
      
      const pBtn = document.getElementById('previewBtn');
      pBtn.textContent = isPreview ? "미리보기 종료" : "미리보기 모드";
      pBtn.style.background = isPreview ? "#10b981" : "";
      pBtn.style.color = isPreview ? "#fff" : "";

      document.getElementById('settingsModal').style.display = 'flex';
  }

  async function toggleAdmin() {
      if(isAdmin) {
          if(confirm("로그아웃 하시겠습니까?")) {
              localStorage.setItem('kac_admin_mode', '0');
              location.reload();
          }
      } else {
          const pw = prompt("관리자 비밀번호");
          if(pw === 'CATC1234') { // 실제 구현시에는 해시값 비교 권장
               localStorage.setItem('kac_admin_mode', '1');
               location.reload();
          } else if(pw) {
               alert("비밀번호 불일치");
          }
      }
  }

  function togglePreview() {
      isPreview = !isPreview;
      localStorage.setItem('kac_preview_active', isPreview ? '1' : '0');
      location.reload();
  }

  function toggleTheme() {
      const isDark = document.body.classList.toggle('dark-mode');
      localStorage.setItem('kac_theme', isDark ? 'dark' : 'light');
  }
  function setTheme(m) {
      document.body.classList.toggle('dark-mode', m==='dark');
  }
  function hexToRgb(hex) {
    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : '37, 99, 235';
  }

  init();
</script>
</body>
</html>
