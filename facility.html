<script>
  const params = new URLSearchParams(location.search);
  const type = params.get('type');
  let isAdmin = localStorage.getItem('kac_admin_mode') === '1';
  let isPreview = localStorage.getItem('kac_preview_active') === '1';
  let menus = [], searchIndex = [], currentEditIdx = -1, currentPage = 1, dragSrcIndex = null;
  const itemsPerPage = 8;
  
  // [보안 수정] 전역 보안 객체 추가 (기본값: CATC1234)
  let globalSecurity = {
      admin_pw: "db2d3257df630ebeb488b0a9435b863702a0a25694205626359045b8427f311c"
  };

  async function init() {
    setTheme(localStorage.getItem('kac_theme') || 'light');
    if(isPreview) document.body.classList.add('preview-active');
    
    // 1. data.json 로드 및 보안 정보 동기화
    try {
        const res = await fetch('data.json?v=' + new Date().getTime());
        if(res.ok) {
            const data = await res.json();
            // [보안 수정] data.json의 보안 설정 로드
            if(data.security && data.security.admin_pw) {
                globalSecurity = data.security;
            }
            syncToLocalStorage(data);
        }
    } catch(e) { console.error("data.json 로딩 실패, 로컬 데이터 사용"); }

    document.getElementById('loadingSpinner').style.opacity = '0';
    setTimeout(() => document.getElementById('loadingSpinner').style.display='none', 500);

    // 2. 초기화
    loadMenuData();
    loadStyles();
    render(); 
    buildSearchIndex();
  }

  // [추가] 페이지가 다시 보일 때 동기화 (Back-Forward Cache 대응)
  window.addEventListener('pageshow', () => {
      const savedStatus = localStorage.getItem('kac_admin_mode') === '1';
      // 현재 변수(isAdmin)와 저장된 상태(savedStatus)가 다르면 새로고침
      if (isAdmin !== savedStatus) {
          location.reload();
      }
      
      const savedPreview = localStorage.getItem('kac_preview_active') === '1';
      if(isPreview !== savedPreview) {
          location.reload();
      }
  });

  // [추가] 다른 탭에서 변경 시 실시간 동기화
  window.addEventListener('storage', (e) => {
      if (e.key === 'kac_admin_mode' || e.key === 'kac_preview_active') {
          location.reload();
      }
  });

  function syncToLocalStorage(data) {
    const order = [];
    data.categories.forEach(cat => {
      if(cat) {
        order.push(cat.id);
        localStorage.setItem(`kac_style_${cat.id}`, JSON.stringify({ name: cat.name, code: cat.code, color: cat.color }));
        const menus = cat.menus.map(m => ({ dataId: m.id, label: m.label, line1: m.line1, line2: m.line2, link: m.link }));
        localStorage.setItem(`kac_menu_${cat.id}`, JSON.stringify(menus));
        cat.menus.forEach(m => { localStorage.setItem(`kac_subs_${cat.id}_${m.id}`, JSON.stringify(m.subjects)); });
      } else { order.push(null); }
    });
    localStorage.setItem('kac_index_order', JSON.stringify(order));
    if(data.config) {
        if(data.config.facIconSize) localStorage.setItem('kac_fac_icon_size', data.config.facIconSize);
        if(data.config.facLabelSize) localStorage.setItem('kac_fac_label_size', data.config.facLabelSize);
    }
  }

  function loadMenuData() {
      try {
          const saved = localStorage.getItem(`kac_menu_${type}`);
          menus = saved ? JSON.parse(saved) : [];
          menus = menus.map(m => { if (!m.line1 && m.code) m.line1 = m.code; return m; });
      } catch(e) { menus = []; }
      
      const sData = localStorage.getItem(`kac_style_${type}`), style = sData ? JSON.parse(sData) : { name: type, color: '#2563eb' };
      document.getElementById('bc').textContent = ` > ${style.name || type}`;
      document.documentElement.style.setProperty('--theme-color', style.color || '#2563eb');
      const rgb = hexToRgb(style.color || '#2563eb');
      document.documentElement.style.setProperty('--theme-rgb', rgb);
  }
  
  function hexToRgb(hex) {
    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : '37, 99, 235';
  }

  function render(direction = 'none') {
    const grid = document.getElementById('trainGrid'), paginCont = document.getElementById('pagination');
    if(!grid || !paginCont) return;
    grid.innerHTML = ''; paginCont.innerHTML = '';
    
    if(direction !== 'none') { 
        grid.style.opacity = '0';
        grid.style.transform = direction === 'next' ? 'translateX(20px)' : 'translateX(-20px)';
        setTimeout(() => {
            grid.style.transition = '0.3s';
            grid.style.opacity = '1';
            grid.style.transform = 'translateX(0)';
        }, 50);
    }

    let list = [...menus]; 
    if(isAdmin && !isPreview) list.push({ isAddButton: true });

    const totalPages = Math.ceil(list.length / itemsPerPage) || 1;
    if(currentPage > totalPages) currentPage = totalPages;
    const start = (currentPage - 1) * itemsPerPage, pageItems = list.slice(start, start + itemsPerPage);

    if (pageItems.length <= 4) { grid.style.display = 'flex'; grid.style.flexWrap = 'wrap'; grid.style.justifyContent = 'center'; }
    else { grid.style.display = 'grid'; grid.style.gridTemplateColumns = 'repeat(4, 280px)'; grid.style.justifyContent = 'center'; }

    pageItems.forEach((item, idx) => {
      const globalIdx = start + idx, card = document.createElement('div');
      card.className = item.isAddButton ? 'menu-card add-btn-wrap' : 'menu-card';
      
      if(isAdmin && !isPreview && !item.isAddButton) {
        card.setAttribute('draggable', 'true');
        card.ondragstart = (e) => { dragSrcIndex = globalIdx; e.target.classList.add('dragging'); };
        card.ondragover = (e) => { e.preventDefault(); card.classList.add('drag-over'); };
        card.ondragleave = () => card.classList.remove('drag-over');
        card.ondrop = (e) => { e.preventDefault(); card.classList.remove('drag-over'); if(dragSrcIndex !== globalIdx) { const moved = menus.splice(dragSrcIndex, 1)[0]; menus.splice(globalIdx, 0, moved); saveData(); } };
        card.ondragend = () => card.classList.remove('dragging');
      }

      if(item.isAddButton) {
        card.style.border = '2px dashed #cbd5e1';
        card.innerHTML = `<div class="icon-circle" style="background:none; border:2px solid #cbd5e1; color:#cbd5e1">+</div><div style="color:#94a3b8; font-weight:800;">메뉴 추가</div>`;
        card.onclick = () => openIndividualEdit('NEW');
      } else {
        const ctrl = (isAdmin && !isPreview) ? `<div class="admin-ctrl" onclick="event.stopPropagation()"><button class="btn-sm" onclick="openIndividualEdit(${globalIdx})">수정</button><button class="btn-sm btn-move" style="color:#2563eb; border-color:#dbeafe;" onclick="openMoveMenuModal(${globalIdx})">이동</button><button class="btn-sm" style="color:#ef4444" onclick="deleteItem(${globalIdx})">삭제</button></div>` : '';
        const l1 = item.line1 || '', l2 = item.line2 ? `<div>${item.line2}</div>` : '';
        card.innerHTML = `<div class="icon-circle"><div>${l1}</div>${l2}</div><div class="menu-label">${item.label || '제목없음'}</div>${ctrl}`;
        card.onclick = () => item.link ? window.open(item.link, '_blank') : location.href = `viewer_list.html?type=${type}&menu=${encodeURIComponent(item.label)}&id=${item.dataId}`;
      }
      grid.appendChild(card);
    });

    if(totalPages > 1) {
      for(let i=1; i<=totalPages; i++) {
        const dot = document.createElement('div');
        dot.className = `page-dot ${i === currentPage ? 'active' : ''}`;
        dot.textContent = i;
        dot.onclick = () => { if(i === currentPage) return; const dir = i > currentPage ? 'next' : 'prev'; currentPage = i; render(dir); };
        if(isAdmin && !isPreview) {
          dot.ondragover = (e) => { e.preventDefault(); dot.classList.add('drag-target'); };
          dot.ondragleave = () => dot.classList.remove('drag-target');
          dot.ondrop = (e) => { e.preventDefault(); dot.classList.remove('drag-target'); const moved = menus.splice(dragSrcIndex, 1)[0]; menus.splice((i-1)*itemsPerPage, 0, moved); currentPage = i; saveData(); };
        }
        paginCont.appendChild(dot);
      }
    }
  }

  function openIndividualEdit(idx) { currentEditIdx = idx; if(idx === 'NEW') ['editItemLine1','editItemLine2','editItemLabel','editItemLink'].forEach(id => document.getElementById(id).value = ''); else { const m = menus[idx]; document.getElementById('editItemLine1').value = m.line1 || ''; document.getElementById('editItemLine2').value = m.line2 || ''; document.getElementById('editItemLabel').value = m.label || ''; document.getElementById('editItemLink').value = m.link || ''; } document.getElementById('itemEditModal').style.display = 'flex'; }
  function saveIndividualEdit() { const data = { line1: document.getElementById('editItemLine1').value, line2: document.getElementById('editItemLine2').value, label: document.getElementById('editItemLabel').value, link: document.getElementById('editItemLink').value, dataId: (currentEditIdx === 'NEW' ? 'id_' + Date.now() : menus[currentEditIdx].dataId) }; if(currentEditIdx === 'NEW') menus.push(data); else menus[currentEditIdx] = data; saveData(); closeModal('itemEditModal'); }
  function openMoveMenuModal(idx) { currentEditIdx = idx; const select = document.getElementById('moveTargetCategory'); select.innerHTML = ''; const mOrder = JSON.parse(localStorage.getItem('kac_index_order') || '[]'); mOrder.forEach(t => { if(!t || t === type) return; const sD = localStorage.getItem(`kac_style_${t}`), s = sD ? JSON.parse(sD) : { name: t }; select.innerHTML += `<option value="${t}">${s.name || t}</option>`; }); document.getElementById('moveMenuModal').style.display = 'flex'; }
  function executeMoveMenu() { const targetType = document.getElementById('moveTargetCategory').value; if(!targetType) return; const item = menus.splice(currentEditIdx, 1)[0], targetMenus = JSON.parse(localStorage.getItem(`kac_menu_${targetType}`) || '[]'); const oK = `kac_subs_${type}_${item.dataId}`, nK = `kac_subs_${targetType}_${item.dataId}`, sD = localStorage.getItem(oK); if(sD) { localStorage.setItem(nK, sD); localStorage.removeItem(oK); } targetMenus.push(item); localStorage.setItem(`kac_menu_${targetType}`, JSON.stringify(targetMenus)); saveData(); alert('이동됨'); closeModal('moveMenuModal'); }
  function openBulkEdit() { const cont = document.getElementById('bulkRowContainer'); cont.innerHTML = ''; for(let i=0; i<30; i++) { const m = menus[i] || {}; cont.innerHTML += `<div class="bulk-row"><div>${i+1}</div><input type="text" class="bulk-input b-line1" value="${m.line1 || ''}"><input type="text" class="bulk-input b-line2" value="${m.line2 || ''}"><input type="text" class="bulk-input b-label" value="${m.label || ''}"><input type="text" class="bulk-input b-link" value="${m.link || ''}"></div>`; } document.getElementById('bulkEditModal').style.display = 'flex'; }
  function saveBulkData() { const rows = document.querySelectorAll('.bulk-row'); let nMs = []; rows.forEach((row, i) => { const l1 = row.querySelector('.b-line1').value, lab = row.querySelector('.b-label').value; if(l1 || lab) nMs.push({ line1: l1, line2: row.querySelector('.b-line2').value, label: lab, link: row.querySelector('.b-link').value, dataId: (menus[i] ? menus[i].dataId : 'id_'+Date.now()+'_'+i) }); }); menus = nMs; saveData(); alert('저장됨'); closeModal('bulkEditModal'); }
  function deleteItem(idx) { if(confirm('정말 삭제하시겠습니까?')) { menus.splice(idx,1); saveData(); alert('삭제됨'); } }

  function openSettings() { 
    const gSet = document.getElementById('guestSettings'), aSet = document.getElementById('adminSettings'); 
    gSet.style.display = isAdmin ? 'none' : 'block';
    aSet.style.display = isAdmin ? 'block' : 'none';
    if(isAdmin) {
      document.getElementById('setFacIconSize').value = localStorage.getItem('kac_fac_icon_size') || 28; 
      document.getElementById('setFacLabelSize').value = localStorage.getItem('kac_fac_label_size') || 18; 
      const pBtn = document.getElementById('modalPreviewBtn'); 
      pBtn.textContent = isPreview ? "미리보기 종료" : "미리보기 시작"; 
      pBtn.classList.toggle('btn-preview-active', isPreview); 
    }
    document.getElementById('settingsModal').style.display = 'flex'; 
  }

  function togglePreview() { isPreview = !isPreview; localStorage.setItem('kac_preview_active', isPreview ? '1' : '0'); document.body.classList.toggle('preview-active', isPreview); render(); closeModal('settingsModal'); }
  function saveData() { localStorage.setItem(`kac_menu_${type}`, JSON.stringify(menus)); render(); buildSearchIndex(); }
  function closeModal(id) { document.getElementById(id).style.display = 'none'; }
  
  // SHA-256 Auth
  async function sha256(message) { const msgBuffer = new TextEncoder().encode(message); const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer); return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join(''); }
  
  // [보안 수정] toggleAdmin이 globalSecurity를 참조하도록 변경
  async function toggleAdmin() { 
    if(isAdmin) { 
        if(confirm("로그아웃?")) { localStorage.setItem('kac_admin_mode','0'); location.reload(); } 
    } else { 
        const pw = prompt("비밀번호"); if(!pw) return;
        const inputHash = await sha256(pw.toUpperCase());
        // localStorage 대신 로드한 JSON의 값을 사용
        const storedHash = globalSecurity.admin_pw;
        if(inputHash === storedHash) { localStorage.setItem('kac_admin_mode','1'); location.reload(); } else alert('비밀번호 불일치');
    } 
  }
  
  function setTheme(m) { document.body.classList.toggle('dark-mode', m==='dark'); localStorage.setItem('kac_theme', m); const bD = document.getElementById('btnDay'), bN = document.getElementById('btnNight'); if(bD) bD.classList.toggle('active', m==='light'); if(bN) bN.classList.toggle('active', m==='dark'); }
  function saveUISettings() { localStorage.setItem('kac_fac_icon_size', document.getElementById('setFacIconSize').value); localStorage.setItem('kac_fac_label_size', document.getElementById('setFacLabelSize').value); loadStyles(); alert('적용됨'); }
  function loadStyles() { document.documentElement.style.setProperty('--icon-size-fac', (localStorage.getItem('kac_fac_icon_size')||'28')+'px'); document.documentElement.style.setProperty('--label-size-fac', (localStorage.getItem('kac_fac_label_size')||'18')+'px'); }

  function exportJsonData() {
    try {
        const newData = { meta: { version: "2.0", lastUpdated: new Date().toISOString().split('T')[0] }, config: {}, categories: [] };
        // [보안 수정] security 객체 포함 (내보낼 때도 현재 로드된 비번 유지)
        newData.security = globalSecurity; 
        
        newData.config.iconSize = localStorage.getItem('kac_idx_icon_size') || 60;
        newData.config.labelSize = localStorage.getItem('kac_idx_label_size') || 24;
        newData.config.facIconSize = localStorage.getItem('kac_fac_icon_size') || 28;
        newData.config.facLabelSize = localStorage.getItem('kac_fac_label_size') || 18;

        const order = JSON.parse(localStorage.getItem('kac_index_order') || '[]');
        order.forEach(id => {
            if(!id) return;
            const s = JSON.parse(localStorage.getItem(`kac_style_${id}`) || '{}');
            const ms = JSON.parse(localStorage.getItem(`kac_menu_${id}`) || '[]');
            const menuList = ms.map(m => {
                const subs = JSON.parse(localStorage.getItem(`kac_subs_${id}_${m.dataId}`) || '[]');
                return { id: m.dataId, label: m.label, line1: m.line1, line2: m.line2, link: m.link, subjects: subs };
            });
            newData.categories.push({ id: id, name: s.name, code: s.code, color: s.color, menus: menuList });
        });

        const str = JSON.stringify(newData, null, 2);
        const blob = new Blob([str], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = "data.json";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        alert("data.json 파일이 다운로드되었습니다.\n깃허브에 업로드해주세요.");
    } catch(e) { alert("내보내기 실패: " + e.message); }
  }

  function buildSearchIndex() { 
    searchIndex = []; 
    const order = JSON.parse(localStorage.getItem('kac_index_order') || '[]');
    order.forEach(tid => {
        if(!tid) return;
        const s = JSON.parse(localStorage.getItem(`kac_style_${tid}`) || '{}');
        const ms = JSON.parse(localStorage.getItem(`kac_menu_${tid}`) || '[]');
        ms.forEach(m => {
            const subs = JSON.parse(localStorage.getItem(`kac_subs_${tid}_${m.dataId}`) || '[]');
            subs.forEach(sub => {
                searchIndex.push({ 
                    name: sub.name, type: tid, code: s.code || tid.substring(0,1), 
                    typeName: s.name, menuName: m.label, menuId: m.dataId, 
                    subId: sub.id, color: s.color 
                });
            });
        });
    });
  }
  
  const sInput = document.getElementById('searchInput'), sOverlay = document.getElementById('searchOverlay'), sRes = document.getElementById('searchDropdown');
  sInput.onfocus = () => { document.body.classList.add('search-mode'); sOverlay.classList.add('active'); if(sInput.value.trim()) sRes.classList.add('active'); };
  sOverlay.onclick = () => { document.body.classList.remove('search-mode'); sOverlay.classList.remove('active'); sRes.classList.remove('active'); };
  sInput.oninput = (e) => {
    const q = e.target.value.toLowerCase().trim();
    if(!q) { sRes.classList.remove('active'); return; }
    const matches = searchIndex.filter(i => i.name.toLowerCase().includes(q));
    sRes.innerHTML = matches.map(i => `
      <div class="result-item" onclick="location.href='viewer_list.html?type=${i.type}&menu=${encodeURIComponent(i.menuName)}&id=${i.menuId}&autoOpen=${i.subId}'">
        <div><div class="res-title">${i.name}</div><div class="res-path">${i.typeName} > ${i.menuName}</div></div>
        <div class="res-tag" style="background:${i.color}">${i.code}</div>
      </div>
    `).join('') || '<div style="padding:15px; text-align:center;">결과 없음</div>';
    sRes.classList.add('active');
  };

  init();
</script>
</body>
