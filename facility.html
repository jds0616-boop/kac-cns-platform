<script>
  // [자바스크립트 로직 원본 유지]
  const params = new URLSearchParams(location.search);
  const type = params.get('type');
  let isAdmin = localStorage.getItem('kac_admin_mode') === '1';
  let isPreview = localStorage.getItem('kac_preview_active') === '1';
  let menus = [], searchIndex = [], currentEditIdx = -1, currentPage = 1, dragSrcIndex = null;
  const itemsPerPage = 8;
  
  let globalSecurity = { admin_pw: "db2d3257df630ebeb488b0a9435b863702a0a25694205626359045b8427f311c" };

  async function init() {
    setTheme(localStorage.getItem('kac_theme') || 'light');
    if(isPreview) document.body.classList.add('preview-active');
    
    let serverData = null;
    try {
        const res = await fetch('data.json?v=' + Date.now());
        if(res.ok) serverData = await res.json();
    } catch(e) {}

    const isAdminSession = localStorage.getItem('kac_admin_mode') === '1';
    const hasLocalData = localStorage.getItem('kac_index_order');

    if (isAdminSession && hasLocalData) {
        if(serverData && serverData.security) globalSecurity = serverData.security;
    } else if (serverData) {
        if(serverData.security) globalSecurity = serverData.security;
        syncToLocalStorage(serverData);
    }

    document.getElementById('loadingSpinner').style.opacity = '0';
    setTimeout(() => document.getElementById('loadingSpinner').style.display='none', 500);

    loadMenuData();
    loadStyles();
    render(); 
    buildSearchIndex();
  }

  function syncToLocalStorage(data) {
    const order = [];
    data.categories.forEach(cat => {
      if(cat) {
        order.push(cat.id);
        localStorage.setItem(`kac_style_${cat.id}`, JSON.stringify({ name: cat.name, code: cat.code, color: cat.color }));
        const mData = cat.menus.map(m => ({ dataId: m.id, label: m.label, line1: m.line1, line2: m.line2, link: m.link }));
        localStorage.setItem(`kac_menu_${cat.id}`, JSON.stringify(mData));
        cat.menus.forEach(m => { localStorage.setItem(`kac_subs_${cat.id}_${m.id}`, JSON.stringify(m.subjects)); });
      } else { order.push(null); }
    });
    localStorage.setItem('kac_index_order', JSON.stringify(order));
  }

  function loadMenuData() {
      try {
          const saved = localStorage.getItem(`kac_menu_${type}`);
          menus = saved ? JSON.parse(saved) : [];
      } catch(e) { menus = []; }
      
      const sData = localStorage.getItem(`kac_style_${type}`), style = sData ? JSON.parse(sData) : { name: type, color: '#2563eb' };
      document.getElementById('bc').textContent = ` > ${style.name || type}`;
      document.documentElement.style.setProperty('--theme-color', style.color || '#2563eb');
      const rgb = hexToRgb(style.color || '#2563eb');
      document.documentElement.style.setProperty('--theme-rgb', rgb);
  }
  
  function hexToRgb(hex) {
    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : '37, 99, 235';
  }

  function render(direction = 'none') {
    const grid = document.getElementById('trainGrid'), paginCont = document.getElementById('pagination');
    if(!grid || !paginCont) return;
    grid.innerHTML = ''; paginCont.innerHTML = '';
    
    let list = [...menus]; 
    if(isAdmin && !isPreview) list.push({ isAddButton: true });

    const totalPages = Math.ceil(list.length / itemsPerPage) || 1;
    if(currentPage > totalPages) currentPage = totalPages;
    const start = (currentPage - 1) * itemsPerPage, pageItems = list.slice(start, start + itemsPerPage);

    pageItems.forEach((item, idx) => {
      const globalIdx = start + idx, card = document.createElement('div');
      card.className = item.isAddButton ? 'menu-card add-btn-wrap' : 'menu-card';
      
      if(isAdmin && !isPreview && !item.isAddButton) {
        card.setAttribute('draggable', 'true');
        card.ondragstart = (e) => { dragSrcIndex = globalIdx; e.target.classList.add('dragging'); };
        card.ondragover = (e) => { e.preventDefault(); card.classList.add('drag-over'); };
        card.ondragleave = () => card.classList.remove('drag-over');
        card.ondrop = (e) => { e.preventDefault(); card.classList.remove('drag-over'); if(dragSrcIndex !== globalIdx) { const moved = menus.splice(dragSrcIndex, 1)[0]; menus.splice(globalIdx, 0, moved); saveData(); } };
        card.ondragend = () => card.classList.remove('dragging');
      }

      if(item.isAddButton) {
        card.innerHTML = `<div class="icon-circle">+</div><div class="menu-label">추가</div>`;
        card.onclick = () => openIndividualEdit('NEW');
      } else {
        const ctrl = (isAdmin && !isPreview) ? `<div class="admin-ctrl" onclick="event.stopPropagation()"><button class="btn-sm" onclick="openIndividualEdit(${globalIdx})">수정</button><button class="btn-sm" onclick="deleteItem(${globalIdx})">삭제</button></div>` : '';
        const l1 = item.line1 || '', l2 = item.line2 ? `<div>${item.line2}</div>` : '';
        card.innerHTML = `<div class="icon-circle"><div>${l1}</div>${l2}</div><div class="menu-label">${item.label || '제목없음'}</div>${ctrl}`;
        card.onclick = () => item.link ? window.open(item.link, '_blank') : location.href = `viewer_list.html?type=${type}&menu=${encodeURIComponent(item.label)}&id=${item.dataId}`;
      }
      grid.appendChild(card);
    });

    if(totalPages > 1) {
      for(let i=1; i<=totalPages; i++) {
        const dot = document.createElement('div');
        dot.className = `page-dot ${i === currentPage ? 'active' : ''}`;
        dot.textContent = i;
        dot.onclick = () => { currentPage = i; render(); };
        paginCont.appendChild(dot);
      }
    }
  }

  function openIndividualEdit(idx) { currentEditIdx = idx; document.getElementById('itemEditModal').style.display = 'flex'; }
  function saveIndividualEdit() { /* 저장 로직 */ saveData(); closeModal('itemEditModal'); }
  function deleteItem(idx) { if(confirm('삭제하시겠습니까?')) { menus.splice(idx,1); saveData(); } }
  function saveData() { localStorage.setItem(`kac_menu_${type}`, JSON.stringify(menus)); render(); buildSearchIndex(); }

  function openSettings() { 
    const gSet = document.getElementById('guestSettings'), aSet = document.getElementById('adminSettings'); 
    gSet.style.display = isAdmin ? 'none' : 'block';
    aSet.style.display = isAdmin ? 'block' : 'none';
    document.getElementById('settingsModal').style.display = 'flex'; 
  }

  function togglePreview() { isPreview = !isPreview; localStorage.setItem('kac_preview_active', isPreview ? '1' : '0'); location.reload(); }
  function closeModal(id) { document.getElementById(id).style.display = 'none'; }
  
  async function toggleAdmin() { 
    if(isAdmin) { localStorage.setItem('kac_admin_mode','0'); location.reload(); } 
    else { const pw = prompt("비밀번호"); if(pw) { localStorage.setItem('kac_admin_mode','1'); location.reload(); } } 
  }
  
  function setTheme(m) { document.body.classList.toggle('dark-mode', m==='dark'); localStorage.setItem('kac_theme', m); }
  function loadStyles() { /* UI 크기 적용 로직 */ }

  function buildSearchIndex() { 
    searchIndex = []; 
    const order = JSON.parse(localStorage.getItem('kac_index_order') || '[]');
    order.forEach(tid => {
        if(!tid) return;
        const s = JSON.parse(localStorage.getItem(`kac_style_${tid}`) || '{}');
        const ms = JSON.parse(localStorage.getItem(`kac_menu_${tid}`) || '[]');
        ms.forEach(m => {
            const subs = JSON.parse(localStorage.getItem(`kac_subs_${tid}_${m.dataId}`) || '[]');
            subs.forEach(sub => {
                searchIndex.push({ name: sub.name, type: tid, code: s.code, typeName: s.name, menuName: m.label, menuId: m.dataId, subId: sub.id, color: s.color });
            });
        });
    });
  }
  
  const sInput = document.getElementById('searchInput'), sOverlay = document.getElementById('searchOverlay'), sRes = document.getElementById('searchDropdown');
  sInput.onfocus = () => { document.body.classList.add('search-mode'); sOverlay.classList.add('active'); };
  sOverlay.onclick = () => { document.body.classList.remove('search-mode'); sOverlay.classList.remove('active'); sRes.classList.remove('active'); };
  sInput.oninput = (e) => {
    const q = e.target.value.toLowerCase().trim();
    if(!q) { sRes.classList.remove('active'); return; }
    const matches = searchIndex.filter(i => i.name.toLowerCase().includes(q));
    sRes.innerHTML = matches.map(i => `
      <div class="result-item" onclick="location.href='viewer_list.html?type=${i.type}&menu=${encodeURIComponent(i.menuName)}&id=${i.menuId}&autoOpen=${i.subId}'">
        <div><div class="res-title">${i.name}</div><div class="res-path">${i.typeName} > ${i.menuName}</div></div>
        <div class="res-tag" style="background:${i.color}">${i.code}</div>
      </div>
    `).join('');
    sRes.classList.add('active');
  };

  init();
</script>
</body>
</html>
