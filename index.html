<!-- 기타 기능 모달들 (디자인 100% 유지) -->
<div id="githubModal" class="modal-overlay"><div class="modal-card"><h3>🐙 GitHub 연동</h3><input type="text" id="ghOwner" class="setting-input" placeholder="Owner"><input type="text" id="ghRepo" class="setting-input" placeholder="Repo"><input type="password" id="ghToken" class="setting-input" placeholder="Token"><button class="btn-modal btn-primary" onclick="uploadToGithub()">업로드 실행</button><button class="btn-modal" onclick="document.getElementById('githubModal').style.display='none'">취소</button></div></div>
<div id="pwChangeModal" class="modal-overlay"><div class="modal-card"><h3>🔐 비밀번호 변경</h3><select id="pwTarget" class="setting-input"><option value="entry">교육생 비밀번호</option><option value="admin">관리자 비밀번호</option></select><input type="password" id="newPw" class="setting-input" placeholder="새 비밀번호"><button class="btn-modal btn-primary" onclick="executePwChange()">변경 실행</button><button class="btn-modal" onclick="document.getElementById('pwChangeModal').style.display='none'">취소</button></div></div>
<div id="footerEditModal" class="modal-overlay"><div class="modal-card"><h3>📝 하단 문구 수정</h3><textarea id="footerTextInput" class="setting-input" style="height:200px;"></textarea><button class="btn-modal btn-primary" onclick="saveFooterText()">저장</button><button class="btn-modal" onclick="document.getElementById('footerEditModal').style.display='none'">취소</button></div></div>
<div id="cardEditModal" class="modal-overlay"><div class="modal-card"><h3>카테고리 수정</h3><input type="text" id="editName" class="setting-input"><input type="text" id="editCode" class="setting-input"><input type="color" id="editColor" style="width:100%; height:40px; margin-bottom:15px;"><label><input type="checkbox" id="chkVisible"> 공개</label><label><input type="checkbox" id="chkAdminOnly"> 관리자전용</label><label><input type="checkbox" id="chkSidebar"> 사이드바</label><button class="btn-modal btn-primary" onclick="saveCardEdit()">저장</button><button class="btn-modal" onclick="document.getElementById('cardEditModal').style.display='none'">취소</button></div></div>

<script>
  let globalData = { categories: [], config: {}, security: {} };
  let isAdmin = localStorage.getItem('kac_admin_mode') === '1';
  let isPreview = localStorage.getItem('kac_preview_active') === '1';
  let searchIndex = [];
  const itemsPerPage = 5; let currentPage = 1;
  let dragSrcIndex = null; let currentTreeSelection = null;

  async function init() {
    setTheme(localStorage.getItem('kac_theme') || 'light');
    if(isPreview) document.body.classList.add('preview-active');
    if(isAdmin) document.body.classList.add('admin-mode');

    try {
        const res = await fetch('data.json?v=' + Date.now());
        if(res.ok) {
            globalData = await res.json();
            syncToLocalStorage(globalData); // 핵심: 서버본으로 하위 subjects까지 로컬 갱신
        } else { reconstructGlobalDataFromLocal(); }
    } catch(e) { reconstructGlobalDataFromLocal(); }

    applyConfig(globalData.config);
    loadFooterText();
    ensurePageSlots();
    renderCards();
    buildSearchIndex();
    renderSidebar();
    
    document.getElementById('loadingSpinner').style.display = 'none';
  }

  // [중요] 모든 페이지의 수정사항을 하나의 JSON으로 긁어모으는 집계 함수
  function reconstructGlobalDataFromLocal() {
    const order = JSON.parse(localStorage.getItem('kac_index_order') || '[]');
    globalData.categories = order.map(id => {
      if(!id) return null;
      const s = JSON.parse(localStorage.getItem(`kac_style_${id}`) || '{}');
      const ms = JSON.parse(localStorage.getItem(`kac_menu_${id}`) || '[]');
      const fullMenus = ms.map(m => ({
          ...m, id: m.dataId, 
          subjects: JSON.parse(localStorage.getItem(`kac_subs_${id}_${m.dataId}`) || '[]')
      }));
      return { id, name: s.name, code: s.code, color: s.color, access: s.access, menus: fullMenus };
    });
    globalData.config = {
      iconSize: parseInt(localStorage.getItem('kac_idx_icon_size') || 60),
      labelSize: parseInt(localStorage.getItem('kac_idx_label_size') || 24),
      pageTitles: JSON.parse(localStorage.getItem('kac_page_titles') || '{}'),
      footerText: localStorage.getItem('kac_full_footer'),
      contentTop: parseInt(localStorage.getItem('kac_content_top') || 135)
    };
    const savedEntry = localStorage.getItem('kac_tmp_entry_pw');
    const savedAdmin = localStorage.getItem('kac_tmp_admin_pw');
    if(savedEntry) globalData.security.entry_pw = savedEntry;
    if(savedAdmin) globalData.security.admin_pw = savedAdmin;
  }

  function syncToLocalStorage(data) {
    const order = data.categories.map(c => c ? c.id : null);
    localStorage.setItem('kac_index_order', JSON.stringify(order));
    data.categories.forEach(cat => {
      if(!cat) return;
      localStorage.setItem(`kac_style_${cat.id}`, JSON.stringify({name:cat.name, code:cat.code, color:cat.color, access:cat.access}));
      localStorage.setItem(`kac_menu_${cat.id}`, JSON.stringify(cat.menus.map(m=>({dataId:m.id, label:m.label, line1:m.line1, line2:m.line2, link:m.link, visible:m.visible}))));
      cat.menus.forEach(m => { localStorage.setItem(`kac_subs_${cat.id}_${m.id}`, JSON.stringify(m.subjects)); });
    });
    if(data.config) {
      localStorage.setItem('kac_idx_icon_size', data.config.iconSize);
      localStorage.setItem('kac_idx_label_size', data.config.labelSize);
      localStorage.setItem('kac_page_titles', JSON.stringify(data.config.pageTitles));
      localStorage.setItem('kac_full_footer', data.config.footerText);
      localStorage.setItem('kac_content_top', data.config.contentTop);
    }
  }

  async function executePwChange() {
    const target = document.getElementById('pwTarget').value;
    const newPw = document.getElementById('newPw').value.trim();
    if(!newPw) return alert("입력하세요.");
    const confirmPw = prompt("대소문자를 구분하여 한 번 더 입력하세요.");
    if(newPw !== confirmPw) return alert("불일치");
    const h = await sha256(newPw);
    if(target==='entry') localStorage.setItem('kac_tmp_entry_pw', h);
    else localStorage.setItem('kac_tmp_admin_pw', h);
    alert("변경됨 (GitHub 업로드 필수)");
    document.getElementById('pwChangeModal').style.display='none';
  }

  async function uploadToGithub() {
    reconstructGlobalDataFromLocal(); // 업로드 전 전수 수집
    const o = localStorage.getItem('kac_gh_owner'), r = localStorage.getItem('kac_gh_repo'), t = localStorage.getItem('kac_gh_token');
    if(!o || !r || !t) return alert("GitHub 설정을 먼저 하세요.");
    const json = JSON.stringify(globalData, null, 2);
    const content = btoa(unescape(encodeURIComponent(json)));
    try {
      const res = await fetch(`https://api.github.com/repos/${o}/${r}/contents/data.json`, { headers:{ Authorization:`token ${t}` } });
      const sha = res.ok ? (await res.json()).sha : null;
      const put = await fetch(`https://api.github.com/repos/${o}/${r}/contents/data.json`, { method:"PUT", headers:{ Authorization:`token ${t}` }, body:JSON.stringify({message:"Web update", content, sha}) });
      if(put.ok) alert("성공!"); else alert("실패");
    } catch(e) { alert("오류발생"); }
  }

  // --- 기존의 모든 UI 렌더링 및 트리 에디터 상세 로직 (생략 없이 원본 유지) ---
  function renderCards() {
    const container = document.getElementById('cardContainer'); container.innerHTML = '';
    const start = (currentPage-1)*itemsPerPage;
    const pageItems = globalData.categories.slice(start, start + itemsPerPage);
    pageItems.forEach((cat, i) => {
      const idx = start + i;
      const card = document.createElement('div');
      if(cat) {
        card.className = 'card' + (isAdmin && (!cat.access.visible || cat.access.adminOnly) ? ' restricted-view' : '');
        card.style.setProperty('--card-color', cat.color);
        card.onclick = () => location.href = `facility.html?type=${cat.id}`;
        if(isAdmin && !isPreview) {
          card.draggable = true;
          card.ondragstart = (e) => { dragSrcIndex = idx; e.target.classList.add('dragging'); };
          card.ondragover = (e) => e.preventDefault();
          card.ondrop = (e) => {
            const tmp = globalData.categories[idx];
            globalData.categories[idx] = globalData.categories[dragSrcIndex];
            globalData.categories[dragSrcIndex] = tmp;
            syncToLocalStorage(globalData); renderCards();
          };
          card.innerHTML = `<div class="card-ctrl" onclick="event.stopPropagation()"><button class="btn-sm" onclick="openEdit('${cat.id}')">수정</button><button class="btn-sm" onclick="deleteCard(${idx})">삭제</button></div>`;
        }
        card.innerHTML += `<div class="icon-box">${cat.code}</div><h2>${cat.name}</h2>`;
      } else {
        card.className = 'card empty-placeholder';
        if(isAdmin && !isPreview) { card.innerHTML = '<div>+</div>'; card.onclick = () => openEdit('NEW', idx); }
      }
      container.appendChild(card);
    });
    renderPagination();
  }

  function renderPagination() {
    const p = document.getElementById('pagination'); p.innerHTML = '';
    const total = Math.ceil(globalData.categories.length / itemsPerPage);
    for(let i=1; i<=total; i++) {
      const dot = document.createElement('div');
      dot.className = 'page-dot' + (i===currentPage?' active':'');
      dot.onclick = () => { currentPage = i; renderCards(); updateHeadline(); };
      p.appendChild(dot);
    }
  }

  function renderTree() {
    const root = document.getElementById('treeRoot'); root.innerHTML = '';
    globalData.categories.forEach((cat, cIdx) => {
      if(!cat) return;
      const div = document.createElement('div'); div.className = 't-node-row';
      div.innerHTML = `<span class="t-toggle-btn" onclick="this.parentElement.nextElementSibling.classList.toggle('open')">▶</span><span class="t-label" onclick="selectNode('cat',${cIdx})">📂 ${cat.name}</span>`;
      root.appendChild(div);
      const childDiv = document.createElement('div'); childDiv.className = 't-children';
      cat.menus.forEach((m, mIdx) => {
        const mRow = document.createElement('div'); mRow.className = 't-node-row';
        mRow.innerHTML = `<span class="t-toggle-btn" onclick="this.parentElement.nextElementSibling.classList.toggle('open')">▶</span><span class="t-label" onclick="selectNode('menu',${cIdx},${mIdx})">📁 ${m.label}</span>`;
        childDiv.appendChild(mRow);
        const sDiv = document.createElement('div'); sDiv.className = 't-children';
        m.subjects.forEach((s, sIdx) => {
          sDiv.innerHTML += `<div class="t-node-row"><span class="t-label" onclick="selectNode('subj',${cIdx},${mIdx},${sIdx})">📄 ${s.name}</span></div>`;
        });
        childDiv.appendChild(sDiv);
      });
      root.appendChild(childDiv);
    });
  }

  function selectNode(type, c, m, s) {
    currentTreeSelection = { type, c, m, s };
    const det = document.getElementById('treeDetail');
    if(type==='cat') {
      const cat = globalData.categories[c];
      det.innerHTML = `<h4>카테고리 설정</h4>이름: <input id="tn" value="${cat.name}" class="setting-input">코드: <input id="tc" value="${cat.code}" class="setting-input"><button class="btn-modal btn-primary" onclick="addTreeItem('menu')">+ 하위 메뉴 추가</button>`;
    } else if(type==='menu') {
      const menu = globalData.categories[c].menus[m];
      det.innerHTML = `<h4>메뉴 설정</h4>이름: <input id="tn" value="${menu.label}" class="setting-input">라인1: <input id="tl1" value="${menu.line1||''}" class="setting-input"><button class="btn-modal btn-primary" onclick="addTreeItem('subj')">+ 하위 과목 추가</button><button class="btn-modal btn-danger" onclick="deleteTreeItem()">삭제</button>`;
    } else if(type==='subj') {
      const subj = globalData.categories[c].menus[m].subjects[s];
      det.innerHTML = `<h4>과목 설정</h4>이름: <input id="tn" value="${subj.name}" class="setting-input">PDF: <input id="tp" value="${subj.pdfName||''}" class="setting-input">오디오: <input id="ta" value="${subj.audioName||''}" class="setting-input"><button class="btn-modal btn-danger" onclick="deleteTreeItem()">삭제</button>`;
    }
  }

  function saveIntegratedData() {
    const {type, c, m, s} = currentTreeSelection;
    if(type==='cat') { globalData.categories[c].name = document.getElementById('tn').value; globalData.categories[c].code = document.getElementById('tc').value; }
    else if(type==='menu') { globalData.categories[c].menus[m].label = document.getElementById('tn').value; globalData.categories[c].menus[m].line1 = document.getElementById('tl1').value; }
    else if(type==='subj') { globalData.categories[c].menus[m].subjects[s].name = document.getElementById('tn').value; globalData.categories[c].menus[m].subjects[s].pdfName = document.getElementById('tp').value; globalData.categories[c].menus[m].subjects[s].audioName = document.getElementById('ta').value; }
    syncToLocalStorage(globalData); renderTree(); renderCards(); alert("반영됨");
  }

  // 기본 공통 함수들
  function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); document.getElementById('sidebarOverlay').classList.toggle('active'); }
  function setTheme(m) { document.body.className = m==='dark'?'dark-mode':''; localStorage.setItem('kac_theme', m); }
  function toggleThemeMobile() { const curr = localStorage.getItem('kac_theme'); setTheme(curr==='dark'?'light':'dark'); }
  function openSettings() { document.getElementById('guestSettings').style.display=isAdmin?'none':'block'; document.getElementById('adminSettings').style.display=isAdmin?'block':'none'; document.getElementById('settingsModal').style.display='flex'; }
  function openIntegratedAdmin() { document.getElementById('integratedAdminModal').style.display='flex'; renderTree(); }
  function openGithubModal() { document.getElementById('ghOwner').value=localStorage.getItem('kac_gh_owner'); document.getElementById('ghRepo').value=localStorage.getItem('kac_gh_repo'); document.getElementById('ghToken').value=localStorage.getItem('kac_gh_token'); document.getElementById('githubModal').style.display='flex'; }
  function openPwChangeModal() { document.getElementById('pwChangeModal').style.display='flex'; }
  function openFooterEditModal() { document.getElementById('footerTextInput').value = globalData.config.footerText; document.getElementById('footerEditModal').style.display='flex'; }
  function saveFooterText() { globalData.config.footerText = document.getElementById('footerTextInput').value; syncToLocalStorage(globalData); loadFooterText(); document.getElementById('footerEditModal').style.display='none'; }
  function loadFooterText() { document.querySelector('.footer-content').innerHTML = globalData.config.footerText || ""; }
  function updateHeadline() { document.getElementById('pageHeadline').textContent = (globalData.config.pageTitles || {})[currentPage] || "제목없음"; document.getElementById('pageBadge').textContent = "Page " + currentPage; }
  function editPageTitle() { if(!isAdmin) return; const t = prompt("제목입력", globalData.config.pageTitles[currentPage]); if(t!==null){ globalData.config.pageTitles[currentPage]=t; syncToLocalStorage(globalData); updateHeadline(); } }
  function saveUISettings() { globalData.config.iconSize = parseInt(document.getElementById('setIconSize').value); globalData.config.labelSize = parseInt(document.getElementById('setLabelSize').value); globalData.config.contentTop = parseInt(document.getElementById('setContentTop').value); syncToLocalStorage(globalData); location.reload(); }
  function resetToDataJson() { if(confirm("초기화하시겠습니까?")) { localStorage.clear(); location.reload(); } }
  function ensurePageSlots() { while(globalData.categories.length % itemsPerPage !== 0) globalData.categories.push(null); }
  function applyConfig(c) { document.documentElement.style.setProperty('--icon-size-idx', c.iconSize+'px'); document.documentElement.style.setProperty('--label-size-idx', c.labelSize+'px'); document.querySelector('.content-wrapper').style.paddingTop = c.contentTop+'px'; }
  async function sha256(m) { const b = new TextEncoder().encode(m); const h = await crypto.subtle.digest('SHA-256', b); return Array.from(new Uint8Array(h)).map(x => x.toString(16).padStart(2, '0')).join(''); }
  function toggleAdmin() { if(isAdmin){ localStorage.setItem('kac_admin_mode','0'); location.reload(); } else { location.replace('login.html'); } }
  function togglePreview() { isPreview = !isPreview; localStorage.setItem('kac_preview_active', isPreview?'1':'0'); location.reload(); }

  // 사이드바 렌더링
  function renderSidebar() {
      const c = document.getElementById('sidebarContent'); c.innerHTML = '';
      globalData.categories.filter(x=>x && (isAdmin || x.access.visible)).forEach(cat => {
          const item = document.createElement('div'); item.className = 'sb-item';
          item.innerHTML = `<span style="display:flex;align-items:center;gap:10px;"><span style="width:10px;height:10px;border-radius:50%;background:${cat.color}"></span>${cat.name}</span>`;
          item.onclick = () => location.href=`facility.html?type=${cat.id}`;
          c.appendChild(item);
      });
  }

  // 검색 인덱스
  function buildSearchIndex() {
    searchIndex = [];
    globalData.categories.filter(x=>x).forEach(cat => {
      cat.menus.forEach(m => {
        m.subjects.forEach(s => {
          searchIndex.push({ name: s.name, type: cat.id, code: cat.code, typeName: cat.name, menuName: m.label, menuId: m.id, subId: s.id, color: cat.color });
        });
      });
    });
  }

  document.getElementById('mainSearch').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    const res = document.getElementById('searchResults');
    if(!q) { res.classList.remove('active'); return; }
    const matches = searchIndex.filter(i => i.name.toLowerCase().includes(q));
    res.innerHTML = matches.map(i => `<div class="result-item" style="padding:15px; cursor:pointer; border-bottom:1px solid #eee;" onclick="location.href='viewer_list.html?type=${i.type}&menu=${encodeURIComponent(i.menuName)}&id=${i.menuId}&autoOpen=${i.subId}'"><b>${i.name}</b> <small>${i.typeName} > ${i.menuName}</small></div>`).join('');
    res.classList.add('active');
  });

  init();
</script>
</body>
</html>
