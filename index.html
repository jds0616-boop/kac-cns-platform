<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>KAC CNS Training Platform</title>

<!-- 1. Firebase 라이브러리 로드 (순서 중요) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script>
  // 2. Firebase 연결 정보
  const firebaseConfig = {
    apiKey: "AIzaSyAUt6WqxWjRoB9xgAWXq2YhVMQutaOZCBc",
    authDomain: "catc-dfb9a.firebaseapp.com",
    databaseURL: "https://catc-dfb9a-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "catc-dfb9a",
    storageBucket: "catc-dfb9a.firebasestorage.app",
    messagingSenderId: "669905270724",
    appId: "1:669905270724:web:c89fcc1d9c8f81b3071691",
    measurementId: "G-H1ME51B4MZ"
  };

  // 3. Firebase 초기화
  if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.database();

  // [보안] 로그인 세션 체크
  if(sessionStorage.getItem('kac_access_token') !== 'granted') {
    location.replace('login.html');
  }

  // [도구] 한글 입력 변환 함수
  function korToEng(str) {
      const kor = "ㅂㅈㄷㄱㅅㅛㅕㅑㅐㅔㅁㄴㅇㄹㅎㅗㅓㅏㅣㅋㅌㅊㅍㅠㅜㅡ";
      const eng = "qwertyuiopasdfghjklzxcvbnm";
      let result = "";
      for (let i = 0; i < str.length; i++) {
          const char = str[i];
          const index = kor.indexOf(char);
          if (index !== -1) result += eng[index];
          else result += char;
      }
      return result;
  }

  // [보안] 1시간 활동 감지 로그아웃
  let inactivityTimer;
  function resetInactivityTimer() {
      clearTimeout(inactivityTimer);
      inactivityTimer = setTimeout(forceLogout, 3600000); 
  }
  function forceLogout() {
      alert("1시간 동안 활동이 없어 보안을 위해 로그아웃됩니다.");
      sessionStorage.clear();
      localStorage.removeItem('kac_login_time');
      location.replace('login.html');
  }

  window.onload = resetInactivityTimer;
  window.onmousemove = resetInactivityTimer;
  window.onmousedown = resetInactivityTimer;
  window.ontouchstart = resetInactivityTimer;
  window.onclick = resetInactivityTimer;
</script>

<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  :root { 
    --navy: #0f172a; --bg-main: #f0f4f8; --bg-card: #ffffff; 
    --text-main: #000000; --text-sub: #334155;
    --border-card: 2px solid transparent; 
    --shadow: 0 10px 25px rgba(0,0,0,0.05);
    --btn-bg: #f8fafc; --btn-border: #e2e8f0; --btn-text: #64748b;
    --header-h: 75px;
  }
  body.dark-mode { --navy: #020617; --bg-main: #0f172a; --bg-card: #1e293b; --text-main: #f1f5f9; --text-sub: #cbd5e1; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body { background: var(--bg-main); display: flex; flex-direction: column; color: var(--text-main); transition: 0.3s; }
  header { height: var(--header-h); background: var(--navy); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.15); z-index: 5000; position: fixed; top: 0; width: 100%; }
  .logo-text { font-size: 20px; font-weight: 800; cursor: pointer; }
  .page-headline { font-size: 24px; font-weight: 800; color: #fff; cursor: pointer; }
  .content-wrapper { width: 100%; height: 100%; padding-top: 135px; display: flex; flex-direction: column; align-items: center; overflow-y: auto; }
  .search-bar { width: 600px; max-width: 90%; padding: 15px 25px; border-radius: 50px; border: 2px solid #cbd5e1; margin-bottom: 40px; }
  #cardContainer { display: flex; flex-wrap: wrap; gap: 30px; width: 100%; justify-content: center; padding-bottom: 50px; }
  .card { background: var(--bg-card); width: 280px; height: 280px; border-radius: 25px; box-shadow: var(--shadow); cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; align-items: center; justify-content: center; border-left: 10px solid #64748b; position: relative; }
  .card:hover { transform: translateY(-10px); }
  .icon-box { width: 100px; height: 100px; border-radius: 30px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; background: var(--btn-bg); font-size: 60px; font-weight: 900; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 9999; display: none; align-items: center; justify-content: center; }
  .modal-card { background: var(--bg-card); padding: 35px; border-radius: 25px; width: 450px; color: var(--text-main); }
  .setting-input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--btn-border); background: var(--btn-bg); margin-bottom: 10px; }
  .btn-modal { width: 100%; padding: 14px; border-radius: 10px; border: none; font-weight: 700; cursor: pointer; margin-top: 10px; }
  .btn-primary { background: var(--navy); color: #fff; }
  .btn-success { background: #10b981; color: #fff; }
  .main-footer { width: 100%; background: var(--navy); padding: 20px; text-align: center; color: rgba(255,255,255,0.6); font-size: 13px; }
</style>
</head>
<body>

<div id="loadingSpinner" style="position:fixed; inset:0; background:white; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center;">
  <div style="width:50px; height:50px; border:5px solid #eee; border-top-color:#2563eb; border-radius:50%; animation:spin 1s linear infinite;"></div>
  <p style="margin-top:20px; font-weight:700; color:#666;">실시간 서버 데이터 로딩 중...</p>
</div>
<style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>

<header>
  <div class="logo-text" onclick="location.reload()">KAC CNS Training Platform</div>
  <div class="header-center-title">
      <span id="pageHeadline" class="page-headline" onclick="editPageTitle()">제목 로딩 중...</span>
  </div>
  <div class="settings-btn" onclick="openSettings()" style="color:white; cursor:pointer; font-size:20px;">⚙️</div>
</header>

<div class="content-wrapper">
  <input type="text" id="mainSearch" class="search-bar" placeholder="시설명 또는 교육 주제 검색..." autocomplete="off">
  <main id="cardContainer"></main>
  <div id="pagination" style="display:flex; gap:10px; margin-bottom:50px;"></div>
</div>

<footer class="main-footer">
  <div id="footerContent"></div>
</footer>

<!-- 설정 모달 -->
<div id="settingsModal" class="modal-overlay">
  <div class="modal-card">
    <h3 style="margin-bottom:20px;">⚙️ 시스템 설정</h3>
    <div id="adminSettings" style="display:none;">
      <button class="btn-modal btn-success" onclick="saveToFirebase()">☁️ 서버에 최종 저장 (Firebase)</button>
      <button class="btn-modal btn-primary" onclick="openPwChangeModal()">🔐 비밀번호 변경</button>
      <button class="btn-modal" style="background:#ef4444; color:white;" onclick="logoutAdmin()">관리자 로그아웃</button>
    </div>
    <div id="guestSettings">
      <button class="btn-modal btn-primary" onclick="toggleAdmin()">관리자 로그인</button>
    </div>
    <button class="btn-modal" onclick="closeModal('settingsModal')" style="background:#eee;">닫기</button>
  </div>
</div>

<!-- 비밀번호 변경 모달 -->
<div id="pwChangeModal" class="modal-overlay">
  <div class="modal-card">
    <h3>🔐 비밀번호 변경</h3>
    <select id="pwTarget" class="setting-input" style="margin-top:15px;">
        <option value="entry">교육생 접속 비밀번호</option>
        <option value="admin">관리자 설정 비밀번호</option>
    </select>
    <input type="password" id="newPw1" class="setting-input" placeholder="새 비밀번호">
    <input type="password" id="newPw2" class="setting-input" placeholder="비밀번호 확인">
    <button class="btn-modal btn-primary" onclick="executePwChange()">변경 실행</button>
    <button class="btn-modal" onclick="closeModal('pwChangeModal')" style="background:#eee;">취소</button>
  </div>
</div>

<script>
  let globalData = { categories: [], config: {}, security: {} };
  let isAdmin = localStorage.getItem('kac_admin_mode') === '1';
  let currentPage = 1;
  const itemsPerPage = 5;

  async function init() {
    // 1회 자동 초기화 로직
    if (!sessionStorage.getItem('kac_auto_reset_flag')) {
        localStorage.clear(); 
        sessionStorage.setItem('kac_auto_reset_flag', 'true');
        location.reload(); 
        return;
    }

    if(isAdmin) document.body.classList.add('admin-mode');

    // Firebase 데이터 로드
    try {
        const snapshot = await db.ref('/').once('value');
        if(snapshot.exists()) {
            globalData = snapshot.val();
            renderCards();
            updateHeadline();
            loadFooter();
        }
    } catch(e) { console.error("데이터 로드 실패", e); }
    
    document.getElementById('loadingSpinner').style.display = 'none';
  }

  function renderCards() {
    const container = document.getElementById('cardContainer');
    container.innerHTML = '';
    
    // 비공개 필터링
    const list = isAdmin ? globalData.categories : globalData.categories.filter(c => c && (c.access?.visible || c.visible !== false));
    
    const start = (currentPage - 1) * itemsPerPage;
    const pageItems = list.slice(start, start + itemsPerPage);

    pageItems.forEach(cat => {
        if(!cat) return;
        const card = document.createElement('div');
        card.className = 'card';
        card.style.borderLeftColor = cat.color;
        card.onclick = () => location.href = `facility.html?type=${cat.id}`;
        card.innerHTML = `<div class="icon-box" style="color:${cat.color}">${cat.code}</div><h2 style="font-weight:800;">${cat.name}</h2>`;
        container.appendChild(card);
    });
    renderPagination(list.length);
  }

  function renderPagination(total) {
    const p = document.getElementById('pagination'); p.innerHTML = '';
    const pages = Math.ceil(total / itemsPerPage);
    for(let i=1; i<=pages; i++) {
        const dot = document.createElement('div');
        dot.style.cssText = `width:12px; height:12px; border-radius:50%; cursor:pointer; background:${i===currentPage?'#0f172a':'#ccc'}`;
        dot.onclick = () => { currentPage = i; renderCards(); };
        p.appendChild(dot);
    }
  }

  function openSettings() {
    document.getElementById('adminSettings').style.display = isAdmin ? 'block' : 'none';
    document.getElementById('guestSettings').style.display = isAdmin ? 'none' : 'block';
    document.getElementById('settingsModal').style.display = 'flex';
  }

  async function toggleAdmin() {
    const pw = prompt("관리자 비밀번호를 입력하세요.");
    if(!pw) return;
    const hash = await sha256(korToEng(pw).toUpperCase());
    if(hash === globalData.security.admin_pw) {
        localStorage.setItem('kac_admin_mode', '1');
        location.reload();
    } else { alert("비밀번호가 틀립니다."); }
  }

  function logoutAdmin() { localStorage.removeItem('kac_admin_mode'); location.reload(); }

  async function saveToFirebase() {
    if(!confirm("수정된 내용을 서버(Firebase)에 저장하시겠습니까?")) return;
    await db.ref('/').set(globalData);
    alert("✅ 서버에 실시간 저장되었습니다.");
  }

  function openPwChangeModal() { closeModal('settingsModal'); document.getElementById('pwChangeModal').style.display = 'flex'; }

  async function executePwChange() {
    const target = document.getElementById('pwTarget').value;
    const p1 = document.getElementById('newPw1').value.trim();
    const p2 = document.getElementById('newPw2').value.trim();
    if(!p1 || korToEng(p1).toUpperCase() !== korToEng(p2).toUpperCase()) return alert("비밀번호가 일치하지 않습니다.");
    
    globalData.security[target === 'entry' ? 'entry_pw' : 'admin_pw'] = await sha256(korToEng(p1).toUpperCase());
    alert("임시 적용되었습니다. 반드시 [서버에 최종 저장] 버튼을 눌러주세요.");
    closeModal('pwChangeModal');
  }

  async function sha256(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function closeModal(id) { document.getElementById(id).style.display = 'none'; }
  function updateHeadline() { document.getElementById('pageHeadline').textContent = globalData.config.pageTitles?.[currentPage] || "KAC CNS Platform"; }
  function loadFooter() { document.getElementById('footerContent').innerHTML = globalData.config.footerText || ""; }
  function editPageTitle() { if(!isAdmin) return; const t = prompt("제목 수정", document.getElementById('pageHeadline').textContent); if(t) { if(!globalData.config.pageTitles) globalData.config.pageTitles={}; globalData.config.pageTitles[currentPage]=t; updateHeadline(); } }

  init();
</script>
</body>
</html>
