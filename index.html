<script>
  // 2. Firebase 설정 (사용자 정보 반영)
  const firebaseConfig = {
    apiKey: "AIzaSyAUt6WqxWjRoB9xgAWXq2YhVMQutaOZCBc",
    authDomain: "catc-dfb9a.firebaseapp.com",
    databaseURL: "https://catc-dfb9a-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "catc-dfb9a",
    storageBucket: "catc-dfb9a.firebasestorage.app",
    messagingSenderId: "669905270724",
    appId: "1:669905270724:web:c89fcc1d9c8f81b3071691",
    measurementId: "G-H1ME51B4MZ"
  };

  // Firebase 초기화
  if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.database();

  // [보안] 로그인 세션 체크
  if(sessionStorage.getItem('kac_access_token') !== 'granted') {
    location.replace('login.html');
  }

  // [도구] 한글 입력(두벌식)을 영어 키보드로 변환
  function korToEng(str) {
      const kor = "ㅂㅈㄷㄱㅅㅛㅕㅑㅐㅔㅁㄴㅇㄹㅎㅗㅓㅏㅣㅋㅌㅊㅍㅠㅜㅡ";
      const eng = "qwertyuiopasdfghjklzxcvbnm";
      let result = "";
      for (let i = 0; i < str.length; i++) {
          const char = str[i];
          const index = kor.indexOf(char);
          if (index !== -1) result += eng[index];
          else result += char;
      }
      return result;
  }

  // [보안] 1시간 활동 감지 로그아웃
  let inactivityTimer;
  function resetInactivityTimer() {
      clearTimeout(inactivityTimer);
      inactivityTimer = setTimeout(forceLogout, 3600000); // 1시간
  }
  function forceLogout() {
      alert("1시간 동안 활동이 없어 보안을 위해 로그아웃됩니다.");
      sessionStorage.clear();
      localStorage.removeItem('kac_login_time');
      location.replace('login.html');
  }

  window.onload = resetInactivityTimer;
  window.onmousemove = resetInactivityTimer;
  window.onmousedown = resetInactivityTimer;
  window.ontouchstart = resetInactivityTimer;
  window.onclick = resetInactivityTimer;
  window.onkeypress = resetInactivityTimer;
  window.onscroll = resetInactivityTimer;
</script>

<!-- 비밀번호 변경 모달 (수정됨) -->
<div id="pwChangeModal" class="modal-overlay">

    <div class="setting-group">
      <label>변경 대상</label>
      <select id="pwTarget" class="setting-input">
        <option value="entry">교육생 접속 비밀번호</option>

    <div class="setting-group">
      <label>새로운 비밀번호</label>
      <input type="password" id="newPw" class="setting-input" placeholder="새 비밀번호">

    </div>
    <div style="display:flex; gap:10px;">
      <button class="btn-modal btn-primary" onclick="executePwChange()">변경 실행</button>

<!-- 설정 모달 -->
<div id="settingsModal" class="modal-overlay">
  <div class="modal-card">
    <h3>⚙️ 시스템 설정</h3>
    <div id="adminSettings" style="display:none; margin-top:20px;">
      <button class="btn-modal btn-primary" onclick="openIntegratedAdmin()">🗂️ 전체 데이터 종합 관리 (Tree Editor)</button>
      <button class="btn-modal btn-success" style="margin-top:10px;" onclick="saveToFirebase()">☁️ 서버에 최종 저장 (Firebase)</button>
      <button class="btn-modal" style="margin-top:10px;" onclick="openPwChangeModal()">🔐 비밀번호 변경</button>
      <button class="btn-modal btn-danger" style="margin-top:10px;" onclick="logoutAdmin()">관리자 로그아웃</button>

      <button class="btn-modal btn-primary" onclick="toggleAdmin()">관리자 로그인</button>

<!-- 통합 관리자 모달 -->
<div id="integratedAdminModal" class="modal-overlay">
  <div class="modal-card modal-card large">
    <div class="modal-title">🗂️ 전체 데이터 종합 관리</div>
    <div class="tree-container">
      <div class="tree-sidebar" id="treeRoot"></div>
      <div class="tree-content" id="treeDetail">항목을 선택하세요.</div>
    </div>
    <div style="margin-top:20px; display:flex; gap:10px;">
      <button class="btn-modal btn-primary" onclick="saveIntegratedData()">임시 적용</button>
      <button class="btn-modal" onclick="closeModal('integratedAdminModal')">닫기</button>
    </div>
  </div>
</div>

<script>
  let globalData = { categories: [], config: {}, security: {} };
  let isAdmin = localStorage.getItem('kac_admin_mode') === '1';
  let currentPage = 1;
  const itemsPerPage = 5;

  async function init() {
    // [보안] 입장 시 1회 자동 초기화 (Firebase 데이터 강제 로드용)
    if (!sessionStorage.getItem('kac_auto_reset_flag')) {
        localStorage.clear(); 
        sessionStorage.setItem('kac_auto_reset_flag', 'true');
        location.reload(); 
        return;
    }

    if(isAdmin) document.body.classList.add('admin-mode');

    // 1. Firebase에서 데이터 가져오기
    try {
        const snapshot = await db.ref('/').once('value');
        if(snapshot.exists()) {
            globalData = snapshot.val();
            console.log("✅ Firebase 데이터 로드 완료");
        }
    } catch(e) { console.error("Firebase 로드 에러", e); }

    updateHeadline();
    loadFooterText();
    renderCards();
    document.getElementById('loadingSpinner').style.display = 'none';
  }

  function renderCards() {
    const container = document.getElementById('cardContainer');
    container.innerHTML = '';
    
    // 비공개 필터링 (관리자 아닐 때)
    const list = isAdmin ? globalData.categories : globalData.categories.filter(c => c && c.access?.visible);
    
    const start = (currentPage - 1) * itemsPerPage;
    const pageItems = list.slice(start, start + itemsPerPage);

    pageItems.forEach((cat, i) => {
        if(!cat) return;
        const card = document.createElement('div');
        card.className = 'card';
        card.style.borderLeftColor = cat.color;
        card.onclick = () => location.href = `facility.html?type=${cat.id}`;
        card.innerHTML = `<div class="icon-box" style="color:${cat.color}">${cat.code}</div><h2>${cat.name}</h2>`;
        container.appendChild(card);
    });
    renderPagination(list.length);
  }

  function renderPagination(total) {
    const p = document.getElementById('pagination'); p.innerHTML = '';
    const pages = Math.ceil(total / itemsPerPage);
    for(let i=1; i<=pages; i++) {
        const dot = document.createElement('div');
        dot.style.cssText = `width:12px; height:12px; border-radius:50%; cursor:pointer; background:${i===currentPage?'#0f172a':'#ccc'}`;
        dot.onclick = () => { currentPage = i; renderCards(); };
        p.appendChild(dot);
    }
  }

  function openSettings() {
    document.getElementById('adminSettings').style.display = isAdmin ? 'block' : 'none';
    document.getElementById('guestSettings').style.display = isAdmin ? 'none' : 'block';
    document.getElementById('settingsModal').style.display = 'flex';
  }

  async function toggleAdmin() {
    const pw = prompt("관리자 비밀번호를 입력하세요.");
    if(!pw) return;
    const hash = await sha256(korToEng(pw).toUpperCase());
    if(hash === globalData.security.admin_pw) {
        localStorage.setItem('kac_admin_mode', '1');
        location.reload();
    } else { alert("비밀번호가 틀립니다."); }
  }

  function logoutAdmin() {
    localStorage.removeItem('kac_admin_mode');
    location.reload();
  }

  // Firebase에 최종 저장하는 함수
  async function saveToFirebase() {
    if(!confirm("현재 수정된 모든 내용을 서버에 저장하시겠습니까?")) return;
    try {
        await db.ref('/').set(globalData);
        alert("✅ 서버(Firebase)에 실시간 저장되었습니다!");
    } catch(e) { alert("저장 실패: " + e.message); }
  }

  async function executePwChange() {
    const target = document.getElementById('pwTarget').value;
    const pw1 = document.getElementById('newPw').value.trim();
    const pw2 = document.getElementById('newPwConfirm').value.trim();

    if(!pw1) return alert("비밀번호를 입력하세요.");
    const finalPw = korToEng(pw1).toUpperCase();
    const finalPwConfirm = korToEng(pw2).toUpperCase();

    if(finalPw !== finalPwConfirm) return alert("비밀번호 확인이 일치하지 않습니다.");

    const newHash = await sha256(finalPw);
    if(target === 'entry') globalData.security.entry_pw = newHash;
    else globalData.security.admin_pw = newHash;

    alert("✅ 비밀번호가 임시 적용되었습니다. 상단 [서버에 최종 저장] 버튼을 눌러야 완전히 반영됩니다.");
    closeModal('pwChangeModal');
  }

  // [도구] SHA-256 암호화
  async function sha256(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function closeModal(id) { document.getElementById(id).style.display = 'none'; }
  function updateHeadline() { document.getElementById('pageHeadline').textContent = globalData.config.pageTitles?.[currentPage] || "KAC CNS Platform"; }
  function loadFooterText() { document.querySelector('.footer-content').innerHTML = globalData.config.footerText || ""; }

  // (나머지 Tree Editor UI 로직 등은 기존과 동일하게 유지)
  function openIntegratedAdmin() {
    closeModal('settingsModal');
    document.getElementById('integratedAdminModal').style.display = 'flex';
    renderTree();
  }
  
  function renderTree() { /* 기존 트리 렌더링 로직 적용 */ }

  init();
</script>
