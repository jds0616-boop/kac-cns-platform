<script>
  // 2. Firebase 설정 (사용자 정보 반영)
  const firebaseConfig = {
    apiKey: "AIzaSyAUt6WqxWjRoB9xgAWXq2YhVMQutaOZCBc",
    authDomain: "catc-dfb9a.firebaseapp.com",
    databaseURL: "https://catc-dfb9a-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "catc-dfb9a",
    storageBucket: "catc-dfb9a.firebasestorage.app",
    messagingSenderId: "669905270724",
    appId: "1:669905270724:web:c89fcc1d9c8f81b3071691",
    measurementId: "G-H1ME51B4MZ"
  };

  // Firebase 초기화
  if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.database();

  // [도구] 한글 입력 변환 함수
  function korToEng(str) {
      const kor = "ㅂㅈㄷㄱㅅㅛㅕㅑㅐㅔㅁㄴㅇㄹㅎㅗㅓㅏㅣㅋㅌㅊㅍㅠㅜㅡ";
      const eng = "qwertyuiopasdfghjklzxcvbnm";
      let result = "";
      for (let i = 0; i < str.length; i++) {
          const char = str[i];
          const index = kor.indexOf(char);
          if (index !== -1) result += eng[index];
          else result += char;
      }
      return result;
  }

  // [보안] 1시간 활동 감지 로그아웃
  let inactivityTimer;
  function resetInactivityTimer() {
      clearTimeout(inactivityTimer);
      inactivityTimer = setTimeout(forceLogout, 3600000); 
  }
  function forceLogout() {
      alert("1시간 동안 활동이 없어 보안을 위해 로그아웃됩니다.");
      sessionStorage.clear();
      localStorage.removeItem('kac_login_time');
      location.replace('login.html');
  }

  window.onload = resetInactivityTimer;
  window.onmousemove = resetInactivityTimer;
  window.onmousedown = resetInactivityTimer;
  window.ontouchstart = resetInactivityTimer;
  window.onclick = resetInactivityTimer;
  window.onkeypress = resetInactivityTimer;
  window.onscroll = resetInactivityTimer;

  // [보안] 로그인 세션 체크
  if(sessionStorage.getItem('kac_access_token') !== 'granted') {
    location.replace('login.html'); 
  }
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  :root { 
    --theme-color: #2563eb; --theme-rgb: 37, 99, 235;
    --navy: #0f172a; --bg-main: #f0f4f8; --bg-card: #ffffff; 
    --text-main: #000000; --text-sub: #334155; 
    --header-h: 75px;
  }
  body.dark-mode { --navy: #020617; --bg-main: #0f172a; --bg-card: #1e293b; --text-main: #f1f5f9; --text-sub: #cbd5e1; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
  body { background: var(--bg-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; color: var(--text-main); transition: 0.3s; }
  header { height: var(--header-h); background: var(--navy); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; color: #fff; z-index: 1000; position: relative; }
  .logo-text { font-size: 20px; font-weight: 800; cursor: pointer; }
  main { flex: 1; overflow-y: auto; padding: 40px; padding-bottom: 100px; display: flex; flex-direction: column; align-items: center; }
  .tree-container { width: 100%; max-width: 900px; position: relative; }
  .fac-top-card { background: var(--bg-card); padding: 25px; border-radius: 20px; border: 2px solid var(--theme-color); border-left: 10px solid var(--theme-color); margin-bottom: 30px; display: flex; align-items: center; gap: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); cursor: pointer; }
  .fac-tag-pill { background: var(--theme-color); color: white; padding: 6px 15px; border-radius: 50px; font-weight: 800; }
  .fac-title { font-size: 22px; font-weight: 800; }
  .subject-card { background: var(--bg-card); width: 100%; padding: 20px 30px; border-radius: 15px; margin-bottom: 15px; border-left: 8px solid var(--theme-color); display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
  .subject-card:hover { transform: translateX(5px); }
  .subject-card.inactive { border-left-color: #ccc; opacity: 0.6; }
  .subj-title { font-size: 18px; font-weight: 700; }
  .status-group { display: flex; gap: 10px; margin-top: 8px; }
  .status-pill { font-size: 11px; padding: 3px 8px; border-radius: 5px; background: #eee; color: #666; font-weight: 700; }
  .status-pill.on { background: #dcfce7; color: #166534; }
  .btn-action { padding: 6px 12px; border-radius: 6px; border: 1px solid #ddd; background: #fff; font-size: 12px; cursor: pointer; }
  #pdfOverlay { position: fixed; inset: 0; background: #000; display: none; z-index: 9000; flex-direction: column; }
  .v-header { padding: 20px; color: white; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.5); }
  .viewer-body { flex: 1; display: flex; justify-content: center; align-items: center; overflow: auto; }
  canvas { max-width: 100%; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 9999; display: none; align-items: center; justify-content: center; }
  .modal-card { background: var(--bg-card); padding: 30px; border-radius: 20px; width: 450px; }
  .setting-input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 10px; }
  .btn-modal { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; margin-top: 5px; }
  .btn-primary { background: #0f172a; color: #fff; }
  .btn-success { background: #10b981; color: #fff; }
  .bottom-nav { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--navy); padding: 12px 40px; border-radius: 100px; display: flex; gap: 30px; color: white; font-weight: 700; cursor: pointer; z-index: 1000; }
</style>
</head>
<body oncontextmenu="return false;">

<header>
  <div class="logo-text" onclick="location.href='index.html'">KAC CNS Training Platform</div>
  <div style="display:flex; align-items:center; gap:15px;">
    <div onclick="openSettings()" style="cursor:pointer; font-size:20px;">⚙️</div>
    <img src="logo.png" style="height:30px;">
  </div>
</header>

<main id="subjectList"></main>

<div id="pdfOverlay">
  <div class="v-header">
    <span id="vTitle" style="font-weight:800; font-size:18px;"></span>
    <div style="display:flex; gap:20px;">
        <button onclick="prevPage()" class="btn-action">이전</button>
        <button onclick="nextPage()" class="btn-action">다음</button>
        <button onclick="closeViewer()" class="btn-action" style="background:#ef4444; color:white; border:none;">닫기(ESC)</button>
    </div>
  </div>
  <div id="viewerBody" class="viewer-body">
    <canvas id="pdfCanvas"></canvas>
  </div>
</div>

<!-- 설정 모달 -->
<div id="settingsModal" class="modal-overlay">
  <div class="modal-card">
    <h3>⚙️ 과목 관리 설정</h3>
    <div id="adminSettings" style="display:none; margin-top:20px;">
      <button class="btn-modal btn-success" onclick="saveAllToFirebase()">☁️ 서버에 최종 저장 (Firebase)</button>
      <button class="btn-modal btn-danger" style="margin-top:10px;" onclick="logoutAdmin()">관리자 로그아웃</button>
    </div>
    <div id="guestSettings">
      <button class="btn-modal btn-primary" onclick="toggleAdmin()">관리자 로그인</button>
    </div>
    <button class="btn-modal" style="margin-top:20px; background:#eee;" onclick="closeModal('settingsModal')">닫기</button>
  </div>
</div>

<!-- 과목 수정 모달 -->
<div id="subjectEditModal" class="modal-overlay">
  <div class="modal-card">
    <h3>📄 과목 정보 수정</h3>
    <input type="text" id="editSubName" class="setting-input" placeholder="과목명">
    <input type="text" id="editSubPdf" class="setting-input" placeholder="PDF 파일명 (예: manual.pdf)">
    <input type="text" id="editSubAudio" class="setting-input" placeholder="오디오 파일명 (예: audio.mp3)">
    <button class="btn-modal btn-primary" onclick="applySubjectEdit()">임시 적용</button>
    <button class="btn-modal" style="background:#eee;" onclick="closeModal('subjectEditModal')">취소</button>
  </div>
</div>

<div class="bottom-nav" onclick="history.back()">뒤로 가기</div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js";

  const params = new URLSearchParams(location.search);
  const type = params.get('type'); 
  const menuId = params.get('id');

  let globalData = null;
  let currentMenu = null;
  let subjects = [];
  let isAdmin = localStorage.getItem('kac_admin_mode') === '1';
  let currentEditIdx = -1;

  // PDF 관련 변수
  let pdfDoc = null, pageNum = 1, isRendering = false;
  const canvas = document.getElementById('pdfCanvas');
  const ctx = canvas.getContext('2d');

  async function init() {
    if(isAdmin) document.body.classList.add('admin-mode');

    // 1. Firebase에서 전체 데이터 로드
    try {
        const snapshot = await db.ref('/').once('value');
        if(snapshot.exists()) {
            globalData = snapshot.val();
            const cat = globalData.categories.find(c => c && c.id === type);
            currentMenu = cat.menus.find(m => m.id === menuId);
            subjects = currentMenu.subjects || [];
            
            document.documentElement.style.setProperty('--theme-color', cat.color);
            render();
        }
    } catch(e) { console.error("Firebase 로드 실패", e); }
  }

  function render() {
    const list = document.getElementById('subjectList');
    list.innerHTML = '';

    const treeContainer = document.createElement('div');
    treeContainer.className = 'tree-container';

    // 상단 카드 (메뉴 정보)
    const topCard = document.createElement('div');
    topCard.className = 'fac-top-card';
    topCard.onclick = () => location.href = `facility.html?type=${type}`;
    topCard.innerHTML = `
        <div class="fac-tag-pill">${currentMenu.line1 || 'INFO'}</div>
        <div class="fac-title">${currentMenu.label}</div>
    `;
    treeContainer.appendChild(topCard);

    // 과목 리스트 생성
    subjects.forEach((sub, idx) => {
        const card = document.createElement('div');
        const isActive = sub.active !== false;
        card.className = `subject-card ${isActive ? '' : 'inactive'}`;
        card.onclick = () => {
            if(!isActive && !isAdmin) return alert("현재 개발 중인 과정입니다.");
            openViewer(idx);
        };

        let adminHtml = isAdmin ? `
            <div class="admin-btns" onclick="event.stopPropagation()">
                <button class="btn-action" onclick="openEdit(${idx})">수정</button>
                <button class="btn-action" style="color:red" onclick="deleteSubject(${idx})">삭제</button>
            </div>
        ` : '';

        card.innerHTML = `
            <div>
                <div class="subj-title">${sub.name}</div>
                <div class="status-group">
                    <span class="status-pill ${sub.pdfName?'on':''}">📄 PDF</span>
                    <span class="status-pill ${sub.audioName?'on':''}">🎧 Audio</span>
                </div>
            </div>
            ${adminHtml}
        `;
        treeContainer.appendChild(card);
    });

    if(isAdmin) {
        const addBtn = document.createElement('div');
        addBtn.className = 'subject-card';
        addBtn.style.borderStyle = 'dashed';
        addBtn.style.justifyContent = 'center';
        addBtn.innerHTML = '+ 새 교육 과목 추가';
        addBtn.onclick = () => addNewSubject();
        treeContainer.appendChild(addBtn);
    }

    list.appendChild(treeContainer);
  }

  // --- 뷰어 로직 ---
  async function openViewer(idx) {
    const sub = subjects[idx];
    if(!sub.pdfName) return alert("등록된 PDF가 없습니다.");
    
    document.getElementById('vTitle').textContent = sub.name;
    document.getElementById('pdfOverlay').style.display = 'flex';
    
    const url = `files/${sub.pdfName}`;
    try {
        const loadingTask = pdfjsLib.getDocument(url);
        pdfDoc = await loadingTask.promise;
        pageNum = 1;
        renderPage();
    } catch(e) { alert("PDF 로딩 실패. 경로를 확인하세요."); closeViewer(); }
  }

  async function renderPage() {
    isRendering = true;
    const page = await pdfDoc.getPage(pageNum);
    const viewport = page.getViewport({ scale: 1.5 });
    canvas.height = viewport.height;
    canvas.width = viewport.width;
    await page.render({ canvasContext: ctx, viewport }).promise;
    isRendering = false;
  }

  function prevPage() { if(pageNum <= 1 || isRendering) return; pageNum--; renderPage(); }
  function nextPage() { if(pageNum >= pdfDoc.numPages || isRendering) return; pageNum++; renderPage(); }
  function closeViewer() { document.getElementById('pdfOverlay').style.display = 'none'; }

  // --- 관리자 로직 ---
  function openEdit(idx) {
    currentEditIdx = idx;
    const s = subjects[idx];
    document.getElementById('editSubName').value = s.name;
    document.getElementById('editSubPdf').value = s.pdfName || '';
    document.getElementById('editSubAudio').value = s.audioName || '';
    document.getElementById('subjectEditModal').style.display = 'flex';
  }

  function applySubjectEdit() {
    const s = subjects[currentEditIdx];
    s.name = document.getElementById('editSubName').value;
    s.pdfName = document.getElementById('editSubPdf').value;
    s.audioName = document.getElementById('editSubAudio').value;
    render();
    closeModal('subjectEditModal');
    alert("임시 적용되었습니다. 최종 저장을 위해 [서버에 최종 저장]을 눌러주세요.");
  }

  function addNewSubject() {
    const name = prompt("새 과목명을 입력하세요.");
    if(name) {
        subjects.push({ id: Date.now().toString(), name: name, active: true });
        render();
    }
  }

  function deleteSubject(idx) {
    if(confirm("정말 삭제하시겠습니까?")) {
        subjects.splice(idx, 1);
        render();
    }
  }

  async function saveAllToFirebase() {
    if(!confirm("모든 변경사항을 서버에 영구 저장하시겠습니까?")) return;
    try {
        await db.ref('/').set(globalData);
        alert("✅ 서버(Firebase) 저장 완료!");
    } catch(e) { alert("저장 실패: " + e.message); }
  }

  async function toggleAdmin() {
    const pw = prompt("관리자 비밀번호");
    if(!pw) return;
    const hash = await sha256(korToEng(pw).toUpperCase());
    if(hash === globalData.security.admin_pw) {
        localStorage.setItem('kac_admin_mode', '1');
        location.reload();
    } else alert("비밀번호 불일치");
  }

  function logoutAdmin() { localStorage.removeItem('kac_admin_mode'); location.reload(); }
  function openSettings() {
    document.getElementById('adminSettings').style.display = isAdmin ? 'block' : 'none';
    document.getElementById('guestSettings').style.display = isAdmin ? 'none' : 'block';
    document.getElementById('settingsModal').style.display = 'flex';
  }
  function closeModal(id) { document.getElementById(id).style.display = 'none'; }
  async function sha256(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  init();
</script>
</body>
</html>
